name: Company News Regression CI

on:
  push:
    paths:
      - "src/market_sentiment/news_*.py"
      - "src/market_sentiment/cli/fulfill_company_data*.py"
      - "tests/test_news_*.py"
      - ".github/workflows/company-data-fulfillment.yml"
      - ".github/workflows/company-news-regression.yml"
  pull_request:
    paths:
      - "src/market_sentiment/news_*.py"
      - "src/market_sentiment/cli/fulfill_company_data*.py"
      - "tests/test_news_*.py"
      - ".github/workflows/company-data-fulfillment.yml"
      - ".github/workflows/company-news-regression.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: company-news-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src/market_sentiment/news_*.py
            src/market_sentiment/cli/fulfill_company_data*.py
            tests/test_news_*.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test news scheduling and freshness without network or model downloads
        run: python -m unittest discover -s tests -p 'test_news_*.py' -v
      - name: Compile production news helpers and entrypoints
        run: python -m py_compile src/market_sentiment/news_*.py src/market_sentiment/cli/fulfill_company_data*.py
