name: Python Source CI

on:
  pull_request:
    paths:
      - "src/market_sentiment/**"
      - ".github/workflows/python-source-ci.yml"
      - ".github/workflows/extended-intelligence.yml"
      - ".github/workflows/earnings-call-fulfillment.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src/market_sentiment
            .github/workflows/extended-intelligence.yml
            .github/workflows/earnings-call-fulfillment.yml
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight runtime dependency
        run: pip install --disable-pip-version-check --no-cache-dir yfinance beautifulsoup4 lxml

      - name: Compile market sentiment source
        run: python -m compileall -q src/market_sentiment

      - name: Validate S&P metadata helpers
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from market_sentiment.cli.build_sp500_heatmap import cache_is_fresh, rows_to_meta_map
          rows = [["Symbol", "Security", "GICS Sector", "GICS Sub-Industry"], ["AAPL", "Apple Inc.", "Information Technology", "Technology Hardware"], ["BRK.B", "Berkshire Hathaway", "Financials", "Multi-Sector Holdings"]]
          meta = rows_to_meta_map(rows)
          assert meta["AAPL"].name == "Apple Inc."
          assert meta["BRK-B"].name == "Berkshire Hathaway"
          assert cache_is_fresh({"fetched_at_utc": datetime.now(timezone.utc).isoformat()}, 7)
          print("S&P metadata helper validation OK")
          PY

      - name: Validate extended-refresh regression guards
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          from market_sentiment.edgar import _classify_document
          source = Path("src/market_sentiment/cli/build_v6_market.py").read_text(encoding="utf-8")
          tree = ast.parse(source)
          functions = {node.name for node in tree.body if isinstance(node, ast.FunctionDef)}
          assert {"priority_subset", "earnings_call_links"}.issubset(functions)
          assert _classify_document("Earnings Call Transcript", "EX-99.2") == "transcript"
          assert _classify_document("Quarterly Financial Results", "EX-99.1") == "earnings_release"
          print("Extended refresh regression guards OK")
          PY

      - name: Validate Phase 9 broad fulfillment contract
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          from bs4 import BeautifulSoup
          from market_sentiment.broad_transcripts import _marketbeat_turns, _stockanalysis_turns

          broad = Path("src/market_sentiment/broad_transcripts.py").read_text(encoding="utf-8")
          fulfill = Path("src/market_sentiment/cli/fulfill_earnings_calls.py").read_text(encoding="utf-8")
          workflow = Path(".github/workflows/earnings-call-fulfillment.yml").read_text(encoding="utf-8")
          assert "stockanalysis.com" in broad and "marketbeat.com" in broad
          assert "never_attempted" in fulfill and "retry-cooldown-hours" in fulfill
          assert "earnings_coverage.json" in fulfill and "earnings_fulfillment_attempts.json" in workflow
          assert 'default: "100"' in workflow

          stock_html = '''<main><div>Full Transcript</div><div>Operator</div><p>Welcome to the call. We will begin with prepared remarks and questions will follow later.</p><h3>Jane Smith</h3><p>Chief Executive Officer</p><p>We delivered strong revenue growth and improved margins this quarter with continued demand.</p><h3>John Doe</h3><p>Chief Financial Officer</p><p>Revenue increased and we expect continued investment while maintaining financial discipline.</p><div>Operator</div><p>We will now begin the question-and-answer session. Our first question comes from Alex Analyst.</p><h3>Alex Analyst</h3><p>Analyst, Example Bank</p><p>Can you discuss guidance and demand for the next quarter in more detail please?</p><h3>Jane Smith</h3><p>Chief Executive Officer</p><p>We remain constructive on demand and expect growth while monitoring uncertainty carefully.</p></main>'''
          turns = _stockanalysis_turns(BeautifulSoup(stock_html, "lxml"))
          assert any(row["section"] == "prepared" for row in turns)
          assert any(row["section"] == "qa" for row in turns)

          market_html = '''<main><h3>Example Q2 2026 Earnings Call Transcript</h3><div>Presentation</div><div>Jane Smith</div><div>Chief Executive Officer</div><div>00:00:10</div><p>We delivered strong growth this quarter and are pleased with execution across the business.</p><div>John Doe</div><div>Chief Financial Officer</div><div>00:02:00</div><p>Revenue and margins improved and our balance sheet remains strong heading into the second half.</p><div>Operator</div><div>00:10:00</div><p>We will now begin the question-and-answer session. Our first question comes from Alex.</p><div>Alex Analyst</div><div>Analyst, Example Bank</div><div>00:10:20</div><p>Can you discuss your outlook for demand and margins over the next quarter?</p></main>'''
          mt = _marketbeat_turns(BeautifulSoup(market_html, "lxml"))
          assert any(row["section"] == "prepared" for row in mt)
          assert any(row["section"] == "qa" for row in mt)

          tree = ast.parse(broad)
          safe_dicts = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute) and node.func.attr == "append" and isinstance(node.func.value, ast.Name) and node.func.value.id == "safe" and node.args and isinstance(node.args[0], ast.Dict):
                  safe_dicts.append(node.args[0])
          assert safe_dicts
          for item in safe_dicts:
              keys = {key.value for key in item.keys if isinstance(key, ast.Constant) and isinstance(key.value, str)}
              assert "text" not in keys
          print("Phase 9 broad fulfillment contract OK")
          PY

      - name: Enforce free public production sources
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              Path("src/market_sentiment/cli/build_v6_market.py"),
              Path("src/market_sentiment/cli/fulfill_earnings_calls.py"),
              Path("src/market_sentiment/v5_news.py"),
              Path("src/market_sentiment/v5_earnings.py"),
              Path("src/market_sentiment/free_transcripts.py"),
              Path("src/market_sentiment/broad_transcripts.py"),
              Path(".github/workflows/extended-intelligence.yml"),
              Path(".github/workflows/earnings-call-fulfillment.yml"),
          ]
          forbidden = ["FINNHUB_TOKEN", "ALPHAVANTAGE_API_KEY", "finnhub-python", "EARNINGS_CALL_TRANSCRIPT"]
          for path in files:
              text = path.read_text(encoding="utf-8")
              hits = [token for token in forbidden if token in text]
              assert not hits, f"Paid/Premium source dependency in {path}: {hits}"
          print("Free public source policy OK")
          PY
