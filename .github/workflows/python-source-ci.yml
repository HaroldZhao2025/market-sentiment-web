name: Python Source CI

on:
  pull_request:
    paths:
      - "src/market_sentiment/**"
      - ".github/workflows/python-source-ci.yml"
      - ".github/workflows/extended-intelligence.yml"
      - ".github/workflows/earnings-call-fulfillment.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src/market_sentiment
            .github/workflows/extended-intelligence.yml
            .github/workflows/earnings-call-fulfillment.yml
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight runtime dependency
        run: pip install --disable-pip-version-check --no-cache-dir yfinance beautifulsoup4 lxml

      - name: Compile market sentiment source
        run: python -m compileall -q src/market_sentiment

      - name: Validate S&P metadata helpers
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from market_sentiment.cli.build_sp500_heatmap import cache_is_fresh, rows_to_meta_map

          rows = [
              ["Symbol", "Security", "GICS Sector", "GICS Sub-Industry"],
              ["AAPL", "Apple Inc.", "Information Technology", "Technology Hardware"],
              ["BRK.B", "Berkshire Hathaway", "Financials", "Multi-Sector Holdings"],
          ]
          meta = rows_to_meta_map(rows)
          assert meta["AAPL"].name == "Apple Inc."
          assert meta["BRK-B"].name == "Berkshire Hathaway"
          assert meta["BRK.B"].sector == "Financials"
          current = {"fetched_at_utc": datetime.now(timezone.utc).isoformat()}
          assert cache_is_fresh(current, 7)
          print("S&P metadata helper validation OK")
          PY

      - name: Validate extended-refresh regression guards
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          from market_sentiment.edgar import _classify_document

          path = Path("src/market_sentiment/cli/build_v6_market.py")
          source = path.read_text(encoding="utf-8")
          tree = ast.parse(source)
          functions = {node.name for node in tree.body if isinstance(node, ast.FunctionDef)}
          assert "priority_subset" in functions
          assert "earnings_call_links" in functions

          shadowed = []
          for node in ast.walk(tree):
              if isinstance(node, (ast.Assign, ast.AnnAssign, ast.NamedExpr)):
                  targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                  for target in targets:
                      if isinstance(target, ast.Name) and target.id == "article_events":
                          shadowed.append(node.lineno)
          assert not shadowed, f"article_events import is shadowed at lines {shadowed}"
          assert _classify_document("Earnings Call Transcript", "EX-99.2") == "transcript"
          assert _classify_document("Quarterly Financial Results", "EX-99.1") == "earnings_release"
          assert _classify_document("Investor Presentation", "EX-99.2") == "presentation"
          print("Extended refresh regression guards OK")
          PY

      - name: Validate Phase 8 fulfillment contract
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          resolver = Path("src/market_sentiment/free_transcripts.py").read_text(encoding="utf-8")
          fulfill = Path("src/market_sentiment/cli/fulfill_earnings_calls.py").read_text(encoding="utf-8")
          workflow = Path(".github/workflows/earnings-call-fulfillment.yml").read_text(encoding="utf-8")
          resolver_tree = ast.parse(resolver)
          resolver_functions = {node.name for node in resolver_tree.body if isinstance(node, ast.FunctionDef)}
          required = {"discover_transcripts", "extract_public_transcript", "score_public_transcript", "fulfill_public_transcript"}
          assert required.issubset(resolver_functions), required - resolver_functions
          assert "transcript_text_redistributed" in resolver
          assert '"AAPL,MSFT,NVDA,AMZN,GOOGL,META,TSLA"' in workflow
          assert "AAPL fulfillment gate failed" in fulfill
          assert "batch_index" in fulfill and "batch_size" in fulfill
          assert "text\": text" not in resolver.split("safe_turns", 1)[-1], "Public artifact path must not redistribute transcript text"
          print("Phase 8 fulfillment contract OK")
          PY

      - name: Enforce free public production sources
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path("src/market_sentiment/cli/build_v6_market.py"),
              Path("src/market_sentiment/cli/fulfill_earnings_calls.py"),
              Path("src/market_sentiment/v5_news.py"),
              Path("src/market_sentiment/v5_earnings.py"),
              Path("src/market_sentiment/free_transcripts.py"),
              Path(".github/workflows/extended-intelligence.yml"),
              Path(".github/workflows/earnings-call-fulfillment.yml"),
          ]
          forbidden = ["FINNHUB_TOKEN", "ALPHAVANTAGE_API_KEY", "finnhub-python", "EARNINGS_CALL_TRANSCRIPT"]
          for path in files:
              text = path.read_text(encoding="utf-8")
              hits = [token for token in forbidden if token in text]
              assert not hits, f"Paid/Premium source dependency in {path}: {hits}"
          print("Free public source policy OK")
          PY
