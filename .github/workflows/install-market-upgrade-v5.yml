      - name: Apply core upgrade
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/market-upgrade-v3/apply_upgrade_v3.py
          git diff --check
          python -m py_compile             src/market_sentiment/cli/build_sp500_index.py             src/market_sentiment/cli/build_portfolio.py             scripts/validate_artifacts.py

      - name: Make research static export independent of generated data
        shell: bash
        run: |
          set -euo pipefail
          cat > 'apps/web/app/research/[slug]/page.tsx' <<'__RESEARCH_PAGE__'
          // apps/web/app/research/[slug]/page.tsx
          import Link from "next/link";
          import { loadResearchIndex, loadResearchStudy } from "../../../lib/research";
          import ResearchStudyClient from "../ResearchStudyClient";

          // Static export must have at least one concrete parameter even when the
          // research data pipeline has not run yet (for example in a clean CI checkout).
          // Production builds still use every real slug emitted by build_research.py.
          export async function generateStaticParams() {
            const idx = await loadResearchIndex();
            const slugs = idx
              .map((x) => String(x?.slug ?? "").trim())
              .filter((slug) => slug.length > 0);
            return slugs.length > 0
              ? slugs.map((slug) => ({ slug }))
              : [{ slug: "__build_check__" }];
          }

          export default async function ResearchStudyPage({
            params,
          }: {
            params: Promise<{ slug: string }>;
          }) {
            const { slug } = await params;
            const study = await loadResearchStudy(slug);
            return (
              <main className="max-w-6xl mx-auto p-6 space-y-6">
                <div className="flex items-center justify-between gap-4">
                  <div className="space-y-1">
                    <Link href="/research" className="text-sm text-zinc-600 hover:underline">
                      ← Back to Research
                    </Link>
                    <h1 className="text-3xl font-bold">{study.title}</h1>
                    <p className="text-zinc-600">{study.summary}</p>
                    <div className="text-xs text-zinc-500">Updated: {study.updated_at}</div>
                  </div>
                </div>
                <ResearchStudyClient study={study} />

                {study.notes?.length ? (
                  <section className="rounded-2xl border border-zinc-200 bg-white p-5 space-y-2">
                    <h2 className="text-lg font-semibold">Notes</h2>
                    <ul className="list-disc pl-5 text-sm text-zinc-700 space-y-1">
                      {study.notes.map((n, i) => (
                        <li key={i}>{n}</li>
                      ))}
                    </ul>
                  </section>
                ) : null}
              </main>
            );
          }
          __RESEARCH_PAGE__
          grep -q '__build_check__' 'apps/web/app/research/[slug]/page.tsx'
          git diff --check -- 'apps/web/app/research/[slug]/page.tsx'

      - name: Run portfolio regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pandas numpy pytest
          PYTHONPATH=src pytest -q tests/test_portfolio_strategy.py

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create lockfile and verify clean-checkout frontend build
        working-directory: apps/web
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_BASE_PATH: "/market-sentiment-web"
        run: |
          set -euo pipefail
          if [ ! -f package-lock.json ]; then
            echo "No package-lock.json found; generating a reproducible lockfile from package.json..."
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
          test -s package-lock.json
          npm ci --no-audit --no-fund
          npm run build
          test -s out/index.html

      - name: Commit and upload upgraded project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             src/market_sentiment/cli/build_sp500_index.py             src/market_sentiment/cli/build_portfolio.py             apps/web/app/sp500/page.tsx             apps/web/app/portfolio/page.tsx             apps/web/app/portfolio/PortfolioClient.tsx             'apps/web/app/research/[slug]/page.tsx'             apps/web/package-lock.json             .github/workflows/pipeline.yml             .github/workflows/ci.yml             scripts/validate_artifacts.py             tests/test_portfolio_strategy.py
          if git diff --cached --quiet; then
            echo "Upgrade is already installed; nothing to commit."
          else
            git commit -m "fix: stabilize SP500 data and upgrade portfolio strategy"
            git push origin HEAD:main
          fi

      - name: Start fresh data build and deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run pipeline.yml --ref main
          echo "SUCCESS: V5 upgrade is on main, the frontend static-route build is verified, package-lock.json is committed, and a fresh Build Data & Deploy Site run was started."
