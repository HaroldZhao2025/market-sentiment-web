name: Refresh Extended Intelligence

on:
  workflow_dispatch: {}
  schedule:
    - cron: "50 19 * * *"

permissions:
  contents: write

concurrency:
  group: extended-intelligence-refresh
  cancel-in-progress: true

env:
  PYTHONPATH: src
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hf-home
          key: phase7-finbert-${{ runner.os }}-py311
      - name: Install dependencies
        run: |
          set -euo pipefail
          echo "HF_HOME=${RUNNER_TEMP}/hf-home" >> "$GITHUB_ENV"
          pip install --no-cache-dir "numpy>=1.26,<3" "pandas>=2.1,<3" "requests>=2.31" "yfinance>=0.2.50" "finnhub-python>=2.4.18" "beautifulsoup4>=4.12" "lxml>=5.2" "html5lib>=1.1"
          pip install --no-cache-dir "torch==2.3.1+cpu" --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir "transformers==4.45.2" "tokenizers==0.20.3"
      - name: Refresh extended intelligence
        env:
          FINNHUB_TOKEN: ${{ secrets.FINNHUB_TOKEN }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: |
          set -euo pipefail
          python -m market_sentiment.cli.build_v6_market_safe --public-root apps/web/public --state-root data/v5 --news-refresh-limit 80 --news-days 45 --news-max-items 60 --earnings-limit 5 --earnings-quarters 4 --score-news
      - name: Validate and persist
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("apps/web/public/data/v5")
          universe = json.loads((root / "universe.json").read_text())
          rows = universe.get("companies") or []
          sp500 = sum(1 for row in rows if row.get("universe") == "S&P 500")
          midcap = sum(1 for row in rows if row.get("universe") == "S&P MidCap 400")
          smallcap = sum(1 for row in rows if row.get("universe") == "S&P SmallCap 600")

          if len(rows) < 1300:
              raise SystemExit(f"Composite universe too small: {len(rows)}")
          if sp500 < 450 or midcap < 300 or smallcap < 450:
              raise SystemExit(f"Universe composition invalid: sp500={sp500} midcap={midcap} smallcap={smallcap}")
          if not list((root / "news").glob("*.json")):
              raise SystemExit("No news artifacts")
          if not (root / "event_instances.json").is_file():
              raise SystemExit("No event instances")

          print(
              f"EXTENDED DATA OK | companies={len(rows)} sp500={sp500} "
              f"midcap={midcap} smallcap={smallcap}"
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/v5 apps/web/public/data/v5
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh extended company intelligence [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
