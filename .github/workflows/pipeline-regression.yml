name: Pipeline Regression CI

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/pipeline.yml"
      - ".github/workflows/pipeline-regression.yml"
  pull_request:
    paths:
      - ".github/workflows/pipeline.yml"
      - ".github/workflows/pipeline-regression.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout workflow source only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: .github/workflows
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.2"
      - name: Pipeline regression tests
        run: |
          python - <<'TEST'
          """Deterministic regression tests for the actual Python embedded in pipeline.yml."""
          from __future__ import annotations
          import argparse
          import copy
          import gzip
          import json
          import math
          import os
          import re
          import subprocess
          import sys
          import tempfile
          import types
          import unittest
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from unittest.mock import patch
          import yaml

          ROOT = Path.cwd()
          WORKFLOW = ROOT / '.github/workflows/pipeline.yml'
          VERSION = 'dedup-finbert-v3-article-sentiment'
          LEGACY = 'dedup-finbert-v2'
          TODAY = datetime.now(timezone.utc).date()

          def scripts_from(path):
              workflow = yaml.load(path.read_text(encoding='utf-8'), Loader=yaml.BaseLoader)
              steps = workflow['jobs']['build']['steps']
              run = next(s['run'] for s in steps if s.get('name') == 'Install final pipeline scripts')
              scripts = dict(re.findall(r"(?m)^cat > /tmp/market-final/(\w+\.py) <<'PY'\n(.*?)(?=^PY$)", run, re.S))
              assert len(scripts) == 6, f'Unexpected embedded scripts: {sorted(scripts)}'
              for name, text in scripts.items():
                  compile(text, name, 'exec')
              for step in steps:
                  if 'run' in step and step.get('shell', 'bash') == 'bash':
                      shell = re.sub(r'\$\{\{.*?\}\}', 'CI_PLACEHOLDER', step['run'])
                      subprocess.run(['bash', '-n'], input=shell, text=True, check=True)
              return workflow, scripts

          def load_module(text, name):
              module = types.ModuleType(name)
              exec(compile(text, name + '.py', 'exec'), module.__dict__)
              return module

          workflow, scripts = scripts_from(WORKFLOW)
          S = load_module(scripts['build_sentiment_v2.py'], 'sentiment_under_test')
          SITE = load_module(scripts['build_complete_site.py'], 'site_under_test')
          FINAL = load_module(scripts['validate_final_data.py'], 'final_under_test')
          assert S.ALGORITHM_VERSION == VERSION

          class Fixture:
              def __init__(self, root):
                  self.root = Path(root)
                  self.data = self.root / 'data'
                  self.data.mkdir(parents=True, exist_ok=True)
                  self.universe = self.data / 'sp500.csv'
                  self.universe.write_text('ticker\nAAA\n', encoding='utf-8')
                  self.cache = self.data / 'derived/sentiment_v2.json.gz'
                  self.manifest = self.root / 'work/manifest.json'
                  self.old = (TODAY - timedelta(days=40)).isoformat()
                  self.retired = (TODAY - timedelta(days=400)).isoformat()
                  self.args = argparse.Namespace(cache=str(self.cache), manifest=str(self.manifest),
                      universe=str(self.universe), data_root=str(self.data), days=14, initial_days=365, batch_size=2)
                  self.payload = {'schema_version': 2, 'algorithm_version': LEGACY, 'records': {}}
                  for ticker, day in [('AAA', self.old), ('ZZZ', self.retired)]:
                      self.payload['records'][ticker] = {day: {'date': day, 'ticker': ticker,
                          'algorithm_version': LEGACY, 'score_mean': 0.2, 'score_std': 0.0,
                          'n_total': 1, 'n_raw': 2, 'n_duplicates': 1, 'source_fingerprint': 'legacy'}}
                      article = {'headline': f'{ticker} earnings improve', 'url': f'https://example.test/{ticker}', 'ts': day + 'T12:00:00Z'}
                      self.news(ticker, day, 'yfinance', [article, article.copy()])
                      self.news(ticker, day, 'finnhub', [article.copy()])
                  self.write_cache()
              def news(self, ticker, day, provider, rows):
                  path = self.data / ticker / 'news' / provider / f'{day}.json'
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(json.dumps(rows), encoding='utf-8')
              def write_cache(self):
                  self.cache.parent.mkdir(parents=True, exist_ok=True)
                  with gzip.open(self.cache, 'wt', encoding='utf-8') as f:
                      json.dump(self.payload, f)
              def read_cache(self):
                  with gzip.open(self.cache, 'rt', encoding='utf-8') as f:
                      return json.load(f)
              def pending(self):
                  return json.loads(self.manifest.read_text(encoding='utf-8'))
              def score(self):
                  fake = types.ModuleType('transformers')
                  class Factory:
                      @staticmethod
                      def from_pretrained(*args, **kwargs):
                          return object()
                  fake.AutoModelForSequenceClassification = Factory
                  fake.AutoTokenizer = Factory
                  def pipeline(*args, **kwargs):
                      def predict(texts, **kwargs):
                          return [[{'label': 'positive', 'score': .7}, {'label': 'neutral', 'score': .2},
                                   {'label': 'negative', 'score': .1}] for _ in texts]
                      return predict
                  fake.pipeline = pipeline
                  with patch.dict(sys.modules, {'transformers': fake}):
                      S.score_manifest(self.args)

          # Reproduce the production failure before testing the patch on the preparation run.
          baseline = Path('/tmp/pipeline-before.yml')
          if baseline.exists():
              _, before_scripts = scripts_from(baseline)
              before = load_module(before_scripts['build_sentiment_v2.py'], 'baseline_sentiment')
              with tempfile.TemporaryDirectory() as tmp:
                  f = Fixture(tmp)
                  f.manifest.parent.mkdir(parents=True)
                  before.scan(f.args)
                  assert not f.pending() and f.read_cache()['algorithm_version'] == LEGACY
                  print('BASELINE REPRODUCED: old cache + no recent news => pending=0 and V2 header, rejected by V3 deployment')

          class MigrationTests(unittest.TestCase):
              def setUp(self):
                  self.tmp = tempfile.TemporaryDirectory()
                  self.addCleanup(self.tmp.cleanup)
                  self.f = Fixture(self.tmp.name)
              def test_01_migrates_outside_hourly_window_and_retired_tickers(self):
                  S.scan(self.f.args)
                  self.assertEqual({(r['ticker'], r['day']) for r in self.f.pending()}, {('AAA', self.f.old), ('ZZZ', self.f.retired)})
                  self.assertEqual(self.f.read_cache()['algorithm_version'], LEGACY)
                  self.assertEqual(self.f.read_cache()['records']['AAA'][self.f.old]['score_mean'], .2)
              def test_02_real_scoring_contract_and_dedup(self):
                  S.scan(self.f.args)
                  self.f.score()
                  obj = self.f.read_cache()
                  self.assertEqual(obj['algorithm_version'], VERSION)
                  for days in obj['records'].values():
                      for record in days.values():
                          self.assertTrue(S.record_is_current(record))
                          self.assertEqual(record['n_total'], 1)
                          self.assertEqual(record['n_raw'], 3)
                          self.assertEqual(record['n_duplicates'], 2)
                          self.assertAlmostEqual(record['score_mean'], .6)
              def test_03_mixed_cache_is_not_trusted_by_header(self):
                  self.f.payload['algorithm_version'] = VERSION
                  self.f.write_cache()
                  S.scan(self.f.args)
                  self.assertEqual(len(self.f.pending()), 2)
              def test_04_missing_article_fields_trigger_migration(self):
                  self.f.payload['algorithm_version'] = VERSION
                  for days in self.f.payload['records'].values():
                      for rec in days.values():
                          rec['algorithm_version'] = VERSION
                  self.f.write_cache()
                  S.scan(self.f.args)
                  self.assertEqual(len(self.f.pending()), 2)
              def test_05_corrupt_cache_is_not_erased(self):
                  self.f.cache.write_bytes(b'not a gzip file')
                  with self.assertRaisesRegex(RuntimeError, 'refusing to replace'):
                      S.scan(self.f.args)
                  self.assertEqual(self.f.cache.read_bytes(), b'not a gzip file')
              def test_06_missing_historical_raw_data_is_not_invented(self):
                  for path in (self.f.data / 'AAA/news').glob('*/*.json'):
                      path.unlink()
                  before = self.f.cache.read_bytes()
                  with self.assertRaisesRegex(RuntimeError, 'original raw headlines are unavailable'):
                      S.scan(self.f.args)
                  self.assertEqual(self.f.cache.read_bytes(), before)
              def test_07_empty_news_stays_null(self):
                  day = (TODAY - timedelta(days=2)).isoformat()
                  self.f.payload['records']['AAA'][day] = {'date': day, 'ticker': 'AAA', 'algorithm_version': LEGACY,
                                                          'n_total': 0, 'score_mean': None}
                  self.f.write_cache()
                  S.scan(self.f.args)
                  rec = self.f.read_cache()['records']['AAA'][day]
                  self.assertIsNone(rec['score_mean'])
                  self.assertEqual(rec['articles'], [])
                  self.f.score()
                  self.assertTrue(S.record_is_current(self.f.read_cache()['records']['AAA'][day]))
              def test_08_noop_scan_does_not_rewrite_cache(self):
                  S.scan(self.f.args)
                  self.f.score()
                  before = self.f.cache.read_bytes()
                  S.scan(self.f.args)
                  self.assertEqual(self.f.pending(), [])
                  self.assertEqual(self.f.cache.read_bytes(), before)
              def test_09_incomplete_finalize_is_rejected(self):
                  before = self.f.cache.read_bytes()
                  with self.assertRaisesRegex(RuntimeError, 'incomplete sentiment migration'):
                      S.save_cache(self.f.cache, self.f.read_cache())
                  self.assertEqual(self.f.cache.read_bytes(), before)
              def test_10_scoring_failure_preserves_unfinished_cache(self):
                  S.scan(self.f.args)
                  before = self.f.cache.read_bytes()
                  fake = types.ModuleType('transformers')
                  class FailingFactory:
                      @staticmethod
                      def from_pretrained(*args, **kwargs):
                          raise RuntimeError('fixture model outage')
                  fake.AutoModelForSequenceClassification = FailingFactory
                  fake.AutoTokenizer = FailingFactory
                  fake.pipeline = lambda **kwargs: None
                  with patch.dict(sys.modules, {'transformers': fake}):
                      with self.assertRaisesRegex(RuntimeError, 'fixture model outage'):
                          S.score_manifest(self.f.args)
                  self.assertEqual(self.f.cache.read_bytes(), before)
              def test_11_full_validator_requires_every_article_contract(self):
                  S.scan(self.f.args)
                  self.f.score()
                  obj = self.f.read_cache()
                  template = obj['records']['AAA'][self.f.old]
                  for i in range(100):
                      obj['records'][f'T{i}'] = {self.f.old: copy.deepcopy(template)}
                  self.f.payload = obj
                  self.f.write_cache()
                  S.validate(self.f.args)
                  obj['records']['T0'][self.f.old]['articles'][0]['probs']['pos'] = .2
                  self.f.write_cache()
                  with self.assertRaisesRegex(RuntimeError, 'Invalid or unmigrated'):
                      S.validate(self.f.args)
              def test_12_cache_date_validation_rejects_future(self):
                  day = (TODAY + timedelta(days=1)).isoformat()
                  self.f.payload['records']['AAA'][day] = self.f.payload['records']['AAA'].pop(self.f.old)
                  self.f.write_cache()
                  before = self.f.cache.read_bytes()
                  with self.assertRaisesRegex(RuntimeError, 'Future retained cache date'):
                      S.scan(self.f.args)
                  self.assertEqual(self.f.cache.read_bytes(), before)

          class FreshnessTests(unittest.TestCase):
              def test_13_missing_is_valid_but_not_numeric_zero(self):
                  for module in (SITE, FINAL):
                      module.validate_spx_observation(None, 0, 0.0)
                      with self.assertRaises(RuntimeError):
                          module.validate_spx_observation(0.0, 0, 0.0)
              def test_14_observed_contract_stays_strict(self):
                  for module in (SITE, FINAL):
                      module.validate_spx_observation(.2, 100, .8)
                      for args in [(None, 10, .2), (.2, 1, .2), (.2, 10, 0), (.2, 10, 2), (float('nan'), 10, .5), (2, 10, .5), (None, 0, .1)]:
                          with self.subTest(args=args), self.assertRaises(RuntimeError):
                              module.validate_spx_observation(*args)
              def test_15_both_site_validation_layers_allow_honest_missing_data(self):
                  with tempfile.TemporaryDirectory() as tmp:
                      root = Path(tmp)
                      pub = root / 'apps/web/public/data'
                      def dump(path, value):
                          path.parent.mkdir(parents=True, exist_ok=True)
                          path.write_text(json.dumps(value), encoding='utf-8')
                      yesterday = (TODAY - timedelta(days=1)).isoformat()
                      today = TODAY.isoformat()
                      daily = [{'date': yesterday, 'close': 6000., 'close_^GSPC': 6000., 'sentiment_cap_weighted': .6,
                                'sentiment_observed_tickers': 100, 'sentiment_coverage_market_cap': .7},
                               {'date': today, 'close': 6100., 'close_^GSPC': 6100., 'sentiment_cap_weighted': None,
                                'sentiment_observed_tickers': 0, 'sentiment_coverage_market_cap': 0.}]
                      spx = {'price_asof': today, 'sentiment_asof': yesterday, 'sentiment_status': 'unavailable', 'daily': daily}
                      dump(pub / 'SPX/sp500_index.json', spx)
                      dump(root / 'data/SPX/sp500_index.json', spx)
                      tickers = [f'T{i}' for i in range(100)]
                      dump(pub / '_tickers.json', tickers)
                      article = {'s': .6, 'sentiment_label': 'Strong Positive', 'probs': {'pos': .7, 'neu': .2, 'neg': .1}}
                      for ticker in tickers:
                          dump(pub / f'ticker/{ticker}.json', {'dates': [yesterday], 'price': [100.], 'S': [.6],
                              'sentiment_observed': [True], 'n_total': [1], 'news': [article]})
                      dump(pub / 'portfolio_strategy.json', {'dates': [today], 'equity': [1.], 'gross_exposure': [.5]})
                      research = root / 'apps/web/public/research'
                      dump(research / 'index.json', [{'slug': f's{i}'} for i in range(8)])
                      dump(research / 'overview.json', {})
                      for i in range(8):
                          dump(research / f's{i}.json', {})
                      SITE.validate_public(pub, tickers, {'latest_close': 6100., 'latest_date': today,
                          'latest_observed_tickers': 0, 'latest_sentiment': None, 'latest_coverage_market_cap': 0., 'latest_unique_news': 0})
                      cwd = Path.cwd()
                      try:
                          os.chdir(root)
                          FINAL.main()
                          spx['sentiment_status'] = 'available'
                          dump(pub / 'SPX/sp500_index.json', spx)
                          dump(root / 'data/SPX/sp500_index.json', spx)
                          with self.assertRaisesRegex(RuntimeError, 'freshness metadata'):
                              FINAL.main()
                      finally:
                          os.chdir(cwd)
              def test_16_production_guards_and_triggers(self):
                  self.assertEqual(workflow['concurrency']['cancel-in-progress'], 'false')
                  self.assertEqual(workflow['jobs']['build']['timeout-minutes'], '360')
                  self.assertIn('push', workflow['on'])
                  self.assertEqual(workflow['on']['push']['branches'], ['main'])
                  self.assertIn('"numpy>=1.26,<2"', WORKFLOW.read_text())
                  self.assertNotIn('npm run build || true', WORKFLOW.read_text())

          class CheckpointTests(unittest.TestCase):
              def setUp(self):
                  self.tmp = tempfile.TemporaryDirectory()
                  self.addCleanup(self.tmp.cleanup)
                  self.checkpoint = Path(self.tmp.name) / 'progress/scores.sqlite3'
                  self.calls = []

              def predict(self, texts, **kwargs):
                  self.calls.extend(texts)
                  return [[{'label': 'positive', 'score': .7}, {'label': 'neutral', 'score': .2},
                           {'label': 'negative', 'score': .1}] for _ in texts]

              def run_score(self, texts, **kwargs):
                  return S.score_headlines(self.predict, texts, self.checkpoint, 2, model_revision='fixture-revision', **kwargs)

              def test_17_interrupted_inference_resumes_committed_chunks(self):
                  def interrupted(texts, **kwargs):
                      if texts == ['second']:
                          raise RuntimeError('fixture inference interruption')
                      return self.predict(texts, **kwargs)
                  with self.assertRaisesRegex(RuntimeError, 'fixture inference interruption'):
                      S.score_headlines(interrupted, {'a': 'first', 'b': 'second'}, self.checkpoint, 2,
                                        model_revision='fixture-revision', chunk_size=1)
                  self.calls.clear()
                  result = self.run_score({'a': 'first', 'b': 'second'}, chunk_size=1)
                  self.assertEqual(self.calls, ['second'])
                  self.assertAlmostEqual(result['a']['s'], .6)
                  self.assertAlmostEqual(result['b']['s'], .6)

              def test_18_completed_checkpoint_never_reinfers(self):
                  self.run_score({'a': 'first'})
                  self.calls.clear()
                  result = self.run_score({'a': 'first'})
                  self.assertEqual(self.calls, [])
                  self.assertEqual(result['a']['sentiment_label'], 'Strong Positive')

              def test_19_model_revision_is_part_of_cache_identity(self):
                  self.run_score({'a': 'first'})
                  self.calls.clear()
                  S.score_headlines(self.predict, {'a': 'first'}, self.checkpoint, 2, model_revision='different-revision')
                  self.assertEqual(self.calls, ['first'])

              def test_20_exact_text_is_part_of_cache_identity(self):
                  self.run_score({'a': 'FIRST'})
                  self.calls.clear()
                  self.run_score({'a': 'first'})
                  self.assertEqual(self.calls, ['first'])

              def test_21_inference_uses_bounded_chunks(self):
                  batches = []
                  def predictor(texts, **kwargs):
                      batches.append(len(texts))
                      return self.predict(texts, **kwargs)
                  result = S.score_headlines(predictor, {str(i):str(i) for i in range(5)}, self.checkpoint, 2,
                                            model_revision='fixture-revision', chunk_size=2)
                  self.assertEqual(batches, [2,2,1])
                  self.assertEqual(len(result), 5)

              def test_22_invalid_predictions_never_enter_checkpoint(self):
                  import sqlite3
                  good = self.predict(['first'])[0]
                  invalid = [good[:1], good + [good[0]],
                             [{'label':'positive','score':.2},{'label':'neutral','score':.2},{'label':'negative','score':.2}],
                             [{'label':'positive','score':float('nan')},{'label':'neutral','score':.2},{'label':'negative','score':.1}],
                             [{'label':'LABEL_0','score':.7},{'label':'neutral','score':.2},{'label':'negative','score':.1}]]
                  for per in invalid:
                      with self.subTest(per=per), self.assertRaises(RuntimeError):
                          S.score_headlines(lambda *a, **k:[per], {'a':'first'}, self.checkpoint, 1, model_revision='fixture-revision')
                  with sqlite3.connect(self.checkpoint) as connection:
                      self.assertEqual(connection.execute('SELECT count(*) FROM predictions').fetchone()[0],0)

              def test_23_length_mismatch_never_becomes_missing_or_neutral(self):
                  with self.assertRaisesRegex(RuntimeError, 'output length mismatch'):
                      S.score_headlines(lambda *a, **k:[], {'a':'first'}, self.checkpoint, 1, model_revision='fixture-revision')

              def test_24_invalid_disposable_score_is_recomputed(self):
                  import sqlite3
                  self.run_score({'a':'first'})
                  with sqlite3.connect(self.checkpoint) as connection:
                      connection.execute('UPDATE predictions SET pos=5')
                  self.calls.clear()
                  result=self.run_score({'a':'first'})
                  self.assertEqual(self.calls,['first'])
                  self.assertAlmostEqual(result['a']['s'],.6)

              def test_25_pipeline_saves_progress_on_failed_scoring(self):
                  steps=workflow['jobs']['build']['steps']
                  score=next(s for s in steps if s.get('name')=='Score unique headlines with FinBERT')
                  save=next(s for s in steps if s.get('name')=='Save validated FinBERT progress even after a failed step')
                  diagnostics=next(s for s in steps if s.get('name')=='Preserve pipeline diagnostics')
                  self.assertIn('always()',save['if'])
                  self.assertLess(int(score['timeout-minutes']),int(workflow['jobs']['build']['timeout-minutes']))
                  self.assertIn('--checkpoint',score['run'])
                  self.assertIn('2>&1 | tee',score['run'])
                  self.assertEqual(diagnostics['if'],'always()')
                  self.assertEqual(workflow['env']['PYTHONUNBUFFERED'],'1')

          class PublicNewsFallbackTests(unittest.TestCase):
              def setUp(self):
                  self.tmp=tempfile.TemporaryDirectory()
                  self.addCleanup(self.tmp.cleanup)
                  self.root=Path(self.tmp.name)
                  self.now=datetime.now(timezone.utc)
                  self.rss_calls=[]
                  self.yahoo_items=[]
                  self.yahoo_error=False
                  self.rss_items=[{'title':'Company results improve - Example Publisher', 'source':'Example Publisher',
                                   'url':'https://news.google.com/rss/articles/example', 'ts':self.now.isoformat()}]
                  owner=self
                  class MiniTimestamp:
                      @staticmethod
                      def now(**kwargs): return owner.now
                      @staticmethod
                      def fromtimestamp(value, **kwargs): return datetime.fromtimestamp(value,timezone.utc)
                  pd=types.ModuleType('pandas')
                  pd.Timestamp=MiniTimestamp
                  pd.Timedelta=timedelta
                  pd.to_datetime=lambda value, **kwargs:datetime.fromisoformat(str(value).replace('Z','+00:00'))
                  pd.isna=lambda value:value is None
                  yf=types.ModuleType('yfinance')
                  class Ticker:
                      def __init__(self,ticker): pass
                      def get_news(self,**kwargs):
                          if owner.yahoo_error: raise RuntimeError('fixture Yahoo outage')
                          return owner.yahoo_items
                  yf.Ticker=Ticker
                  with patch.dict(sys.modules,{'pandas':pd,'yfinance':yf}):
                      self.raw=load_module(scripts['refresh_raw_data.py'],'raw_news_under_test')
                  rss=types.ModuleType('market_sentiment.v5_news')
                  def fetch(ticker,**kwargs):
                      owner.rss_calls.append(ticker)
                      return owner.rss_items
                  rss.google_news_rss=fetch
                  self.mock_modules={'market_sentiment.v5_news':rss}

              def refresh(self, tickers=None, run_kind='manual'):
                  with patch.dict(sys.modules,self.mock_modules):
                      self.raw.refresh_yahoo_news(tickers or ['AAA'],self.root,run_kind)

              def test_26_empty_yahoo_uses_separately_attributed_rss(self):
                  self.refresh()
                  path=self.root/'AAA/news/google_news_rss'/f'{self.now.date().isoformat()}.json'
                  rows=json.loads(path.read_text())
                  self.assertEqual(self.rss_calls,['AAA'])
                  self.assertEqual(rows[0]['provider'],'google_news_rss')
                  self.assertEqual(rows[0]['source'],'Example Publisher')
                  self.assertEqual(rows[0]['headline'],'Company results improve')
                  self.assertFalse((self.root/'AAA/news/yfinance').exists())

              def test_27_yahoo_exception_does_not_skip_fallback(self):
                  self.yahoo_error=True
                  self.refresh()
                  self.assertEqual(self.rss_calls,['AAA'])
                  self.assertTrue(list((self.root/'AAA/news/google_news_rss').glob('*.json')))

              def test_28_usable_yahoo_avoids_unnecessary_fallback(self):
                  self.yahoo_items=[{'content':{'title':'Company results improve','pubDate':self.now.isoformat(),
                                     'canonicalUrl':{'url':'https://example.test/a'}}}]
                  self.refresh()
                  self.assertEqual(self.rss_calls,[])
                  self.assertTrue(list((self.root/'AAA/news/yfinance').glob('*.json')))

              def test_29_empty_rss_stops_after_five_consecutive_misses(self):
                  self.rss_items=[]
                  self.refresh([f'T{i}' for i in range(10)])
                  self.assertEqual(len(self.rss_calls),5)
                  self.assertFalse(list(self.root.rglob('*.json')))

              def test_30_future_or_old_rss_is_not_written(self):
                  self.rss_items=[dict(self.rss_items[0],ts=(self.now+timedelta(days=2)).isoformat()),
                                  dict(self.rss_items[0],ts=(self.now-timedelta(days=100)).isoformat())]
                  self.refresh()
                  self.assertFalse(list(self.root.rglob('*.json')))

              def test_31_hourly_fallback_is_bounded_and_rotates(self):
                  tickers=[f'T{i}' for i in range(210)]
                  self.refresh(tickers,run_kind='hourly')
                  first=set(self.rss_calls)
