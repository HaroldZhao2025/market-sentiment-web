name: Fulfill Company News and History

on:
  push:
    paths:
      - ".github/workflows/company-data-fulfillment.yml"
      - ".github/company-data-fulfillment-trigger"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Companies per fulfillment batch"
        required: false
        default: "250"
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: company-data-fulfillment
  cancel-in-progress: false

env:
  PYTHONPATH: src
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  fulfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout: |
            src/market_sentiment
            apps/web/public/data/v5
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/company-data-cache
          key: phase11-company-data-${{ runner.os }}-py311

      - name: Install free-public data dependencies
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/company-data-cache"
          echo "HF_HOME=${RUNNER_TEMP}/company-data-cache/hf-home" >> "$GITHUB_ENV"
          pip install --disable-pip-version-check --no-cache-dir \
            "numpy>=1.26,<3" "pandas>=2.1,<3" "requests>=2.31" "yfinance>=0.2.50" \
            "beautifulsoup4>=4.12" "lxml>=5.2"
          pip install --disable-pip-version-check --no-cache-dir "torch==2.3.1+cpu" --index-url https://download.pytorch.org/whl/cpu
          pip install --disable-pip-version-check --no-cache-dir "transformers==4.45.2" "tokenizers==0.20.3"

      - name: Resolve batch size
        id: batch
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BATCH_SIZE: ${{ github.event.inputs.batch_size }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          if os.getenv("EVENT_NAME") == "workflow_dispatch":
              size = int(os.getenv("INPUT_BATCH_SIZE") or 250)
          else:
              size = 250
          print(f"size={size}")
          PY

      - name: Fulfill company news and history
        run: |
          set -euo pipefail
          python -m market_sentiment.cli.fulfill_company_data_priority \
            --public-root apps/web/public \
            --batch-size "${{ steps.batch.outputs.size }}" \
            --news-days 1095 \
            --news-max-items 360 \
            --history-period 5y \
            --workers 16 \
            --score-cache "${RUNNER_TEMP}/company-data-cache/headline_scores.json.gz"
          python -m market_sentiment.cli.build_multi_index_sentiment \
            --public-root apps/web/public

      - name: Validate company data coverage artifact
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("apps/web/public/data/v5")
          coverage = json.loads((root / "company_data_coverage.json").read_text())
          indices = json.loads((root / "index_sentiment.json").read_text())
          if coverage.get("source_policy") != "free_public_only":
              raise SystemExit("Company data source policy is not free_public_only")
          if int(coverage.get("company_count") or 0) < 1300:
              raise SystemExit("Company data universe unexpectedly small")
          if int(coverage.get("history_ready_count") or 0) <= 0:
              raise SystemExit("No company price history artifacts were produced")
          codes = {row.get("code") for row in (indices.get("indexes") or [])}
          required = {"SP500", "SP400", "SP600", "SP1500", "BROAD_US"}
          if not required.issubset(codes):
              raise SystemExit(f"Missing multi-index sentiment series: {sorted(required - codes)}")
          print(
              f"COMPANY DATA OK | news={coverage.get('news_ready_count')}/{coverage.get('company_count')} "
              f"history={coverage.get('history_ready_count')}/{coverage.get('company_count')} "
              f"attempted={coverage.get('attempted_count')}/{coverage.get('company_count')} "
              f"indexes={len(codes)}"
          )
          PY

      - name: Persist company data artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            apps/web/public/data/v5/news \
            apps/web/public/data/v5/history \
            apps/web/public/data/v5/company_data_coverage.json \
            apps/web/public/data/v5/company_data_fulfillment_attempts.json \
            apps/web/public/data/v5/index_sentiment.json \
            apps/web/public/data/v5/universe.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: fulfill company news and history [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
