name: Build Data & Deploy Site

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/pipeline.yml"]
  workflow_dispatch: {}
  schedule:
    - cron: "0 * * * *"
    - cron: "15 20 * * *"
    - cron: "15 21 * * *"

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: market-site-production
  # A full cache migration can take longer than the hourly schedule.
  cancel-in-progress: false

env:
  PYTHONPATH: src
  NEXT_PUBLIC_BASE_PATH: "/market-sentiment-web"
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  PYTHONUNBUFFERED: "1"
  SENTIMENT_ALGORITHM_VERSION: "dedup-finbert-v3-article-sentiment"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Classify run
        shell: bash
        run: |
          set -euo pipefail
          RK=manual
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "0 * * * *") RK=hourly ;;
              *) RK=daily ;;
            esac
          fi
          echo "RUN_KIND=$RK" >> "$GITHUB_ENV"
          echo "Run kind: $RK"

      - name: Disable obsolete installer workflows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" --paginate             --jq '.workflows[] | [.id,.name] | @tsv' | while IFS=$'	' read -r wid name; do
              case "$name" in
                "Install Market Sentiment Upgrade"|"Install Market Sentiment Upgrade V2"|"Install Market Sentiment Upgrade V3"|"Install Market Sentiment Upgrade V4"|"Install Market Sentiment Upgrade V5"|"Install Market Sentiment Upgrade V6"|"Repair Market Data & Deploy"|"Repair Market Data & Deploy V2"|"Repair Market Data & Deploy V3"|"Stable Market Site Post-Processor"|"Complete Stable Market Pipeline")
                  echo "Disabling obsolete workflow: $name"
                  gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/$wid/disable" >/dev/null || true
                  ;;
              esac
            done

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install base Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel setuptools
          pip install --no-cache-dir             "numpy>=1.26,<2" "pandas>=2.1,<3" "statsmodels>=0.14,<1"             "requests>=2.31" "yfinance>=0.2.50" "finnhub-python>=2.4.18"             "beautifulsoup4>=4.12" "lxml>=5.2" "html5lib>=1.1"

      - name: Install final pipeline scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/market-final
          cat > /tmp/market-final/refresh_raw_data.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations
          import argparse, csv, json, math, os, time
          from collections import defaultdict
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from typing import Any

          import pandas as pd
          import yfinance as yf


          def load_json(path: Path, default: Any):
              try:
                  return json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  return default


          def atomic_json(path: Path, obj: Any):
              path.parent.mkdir(parents=True, exist_ok=True)
              tmp = path.with_suffix(path.suffix + '.tmp')
              tmp.write_text(json.dumps(obj, ensure_ascii=False, indent=2, allow_nan=False), encoding='utf-8')
              os.replace(tmp, path)


          def read_universe(path: Path) -> list[str]:
              with path.open(newline='', encoding='utf-8') as f:
                  rows = list(csv.DictReader(f))
              if not rows:
                  return []
              col = next((c for c in rows[0] if c.lower() in {'ticker','symbol'}), None)
              if col is None:
                  return []
              out=[]; seen=set()
              for r in rows:
                  t=str(r.get(col) or '').strip().upper().replace('.', '-')
                  if t and t not in seen:
                      seen.add(t); out.append(t)
              return out


          def finite(v: Any) -> float | None:
              try: x=float(v)
              except (TypeError, ValueError): return None
              return x if math.isfinite(x) else None


          def close_series(df: pd.DataFrame, ticker: str) -> pd.Series | None:
              if df is None or df.empty:
                  return None
              try:
                  cols=df.columns
                  if isinstance(cols, pd.MultiIndex):
                      candidates=[(ticker,'Close'),('Close',ticker),(ticker.replace('-','.'),'Close'),('Close',ticker.replace('-','.'))]
                      for key in candidates:
                          if key in cols:
                              s=df[key]
                              return pd.to_numeric(s, errors='coerce')
                      # If one ticker came back with a MultiIndex, accept the unique Close column.
                      matches=[c for c in cols if any(str(x)=='Close' for x in (c if isinstance(c,tuple) else (c,)))]
                      if len(matches)==1:
                          return pd.to_numeric(df[matches[0]], errors='coerce')
                  elif 'Close' in cols:
                      return pd.to_numeric(df['Close'], errors='coerce')
              except Exception:
                  return None
              return None


          def merge_price_file(path: Path, series: pd.Series) -> int:
              existing=load_json(path, [])
              pmap={}
              if isinstance(existing, list):
                  for r in existing:
                      if not isinstance(r,dict): continue
                      d=str(r.get('date') or '')[:10]; c=finite(r.get('close'))
                      if len(d)==10 and c is not None and c>0: pmap[d]=c
              added=0
              for idx,val in series.dropna().items():
                  c=finite(val)
                  if c is None or c<=0: continue
                  try: d=pd.Timestamp(idx).date().isoformat()
                  except Exception: continue
                  if d not in pmap or abs(pmap[d]-c)>1e-10: added+=1
                  pmap[d]=c
              rows=[{'date':d,'close':float(pmap[d])} for d in sorted(pmap)]
              if rows: atomic_json(path, rows)
              return added


          def refresh_prices(tickers: list[str], data_root: Path, run_kind: str):
              today=datetime.now(timezone.utc).date()
              lookback=30 if run_kind=='hourly' else 400
              start=(today-timedelta(days=lookback)).isoformat()
              end=(today+timedelta(days=1)).isoformat()  # yfinance end is exclusive
              changed=0; with_data=0
              batch_size=60
              for i in range(0,len(tickers),batch_size):
                  chunk=tickers[i:i+batch_size]
                  try:
                      df=yf.download(chunk, start=start, end=end, interval='1d', auto_adjust=False,
                                     group_by='ticker', threads=True, progress=False, timeout=30)
                  except TypeError:
                      df=yf.download(chunk, start=start, end=end, interval='1d', auto_adjust=False,
                                     group_by='ticker', threads=True, progress=False)
                  except Exception as e:
                      print(f'[PRICE] batch {i//batch_size+1} failed: {e}')
                      df=pd.DataFrame()
                  for t in chunk:
                      s=close_series(df,t)
                      if s is None or s.dropna().empty:
                          continue
                      changed += merge_price_file(data_root/t/'price'/'daily.json', s)
                      with_data += 1
              print(f'[PRICE] ticker_files_refreshed={with_data}/{len(tickers)} changed_rows={changed}')

              # Refresh ^GSPC independently so the homepage never depends on SPY or ticker-batch behavior.
              existing=load_json(data_root/'SPX'/'sp500_index.json', {})
              old_daily=existing.get('daily') if isinstance(existing,dict) else []
              try:
                  spx=yf.download('^GSPC', start=start, end=end, interval='1d', auto_adjust=False, progress=False, threads=False)
                  s=close_series(spx,'^GSPC')
              except Exception as e:
                  print(f'[SPX] live download failed; validating cached raw SPX instead: {e}')
                  s=None
              pmap={}
              if isinstance(old_daily,list):
                  for r in old_daily:
                      if not isinstance(r,dict): continue
                      d=str(r.get('date') or '')[:10]
                      c=finite(r.get('close'))
                      if c is None:
                          # Backward-compatible legacy fields.
                          for k,v in r.items():
                              if str(k).startswith('close_'):
                                  c=finite(v); break
                      if len(d)==10 and c is not None and c>1000: pmap[d]=c
              if s is not None and not s.dropna().empty:
                  for idx,val in s.dropna().items():
                      c=finite(val)
                      if c is None or c<=1000: continue
                      pmap[pd.Timestamp(idx).date().isoformat()]=c
              daily=[{'date':d,'close':float(pmap[d])} for d in sorted(pmap)]
              if not daily or float(daily[-1]['close'])<=1000:
                  raise RuntimeError('SPX price validation failed')
              atomic_json(data_root/'SPX'/'sp500_index.json', {
                  'symbol':'SPX','name':'S&P 500 Index','price_source':'^GSPC',
                  'daily':daily,
              })
              print(f"[SPX] latest={daily[-1]['date']} close={daily[-1]['close']:.2f} rows={len(daily)}")


          def norm_ts(v: Any):
              if v is None: return None
              try:
                  iv=int(v)
                  if iv>10_000_000_000: iv=iv/1000
                  return pd.Timestamp.fromtimestamp(iv, tz='UTC')
              except Exception:
                  try:
                      x=pd.to_datetime(v, utc=True, errors='coerce')
                      return None if pd.isna(x) else x
                  except Exception: return None


          def merge_news(path: Path, rows: list[dict[str,Any]]):
              old=load_json(path, [])
              if not isinstance(old,list): old=[]
              merged=[]; seen=set()
              for item in old+rows:
                  if not isinstance(item,dict): continue
                  title=str(item.get('headline') or item.get('title') or '').strip()
                  url=str(item.get('url') or '').strip()
                  ts=str(item.get('ts') or '')
                  if not title: continue
                  key=(title.casefold(),url,ts[:10])
                  if key in seen: continue
                  seen.add(key); merged.append(item)
              merged.sort(key=lambda x:str(x.get('ts') or ''))
              atomic_json(path,merged)


          def refresh_yahoo_news(tickers:list[str], data_root:Path, run_kind:str):
              today=pd.Timestamp.now(tz='UTC')
              window_days=5 if run_kind=='hourly' else 45
              cutoff=today-pd.Timedelta(days=window_days)
              count=120 if run_kind=='hourly' else 250
              saved=0
              rss_saved=0
              rss_attempts=0
              rss_empty_streak=0
              fallback_started=time.monotonic()
              fallback_limit=100 if run_kind=='hourly' else len(tickers)
              blocks=max(1, math.ceil(len(tickers)/max(1, fallback_limit)))
              block=int(today.timestamp()//3600)%blocks if run_kind=='hourly' else 0
              fallback_tickers=set(tickers[block*fallback_limit:(block+1)*fallback_limit])
              for j,t in enumerate(tickers,1):
                  try: items=yf.Ticker(t).get_news(count=count, tab='all') or []
                  except Exception as e:
                      if j%50==0: print(f'[YF NEWS] {t} error: {e}')
                      items=[]
                  by_day=defaultdict(list)
                  for it in items:
                      if not isinstance(it,dict): continue
                      content=it.get('content') if isinstance(it.get('content'),dict) else {}
                      ts=(norm_ts(it.get('providerPublishTime')) or norm_ts(content.get('pubDate')) or
                          norm_ts(content.get('displayTime')) or norm_ts(content.get('published')))
                      if ts is None or ts<cutoff or ts>today+pd.Timedelta(hours=2): continue
                      title=str(content.get('title') or it.get('title') or '').strip()
                      if not title: continue
                      cu=content.get('canonicalUrl') if isinstance(content.get('canonicalUrl'),dict) else {}
                      ctu=content.get('clickThroughUrl') if isinstance(content.get('clickThroughUrl'),dict) else {}
                      url=str(cu.get('url') or ctu.get('url') or it.get('link') or it.get('url') or '')
                      prov=content.get('provider')
                      if isinstance(prov,dict): source=str(prov.get('displayName') or prov.get('name') or 'Yahoo')
                      else: source=str(prov or 'Yahoo')
                      row={'ts':ts.isoformat(),'headline':title,'summary':str(content.get('summary') or content.get('description') or it.get('summary') or title).strip(),
                           'url':url,'source':source,'provider':'yfinance'}
                      by_day[ts.date().isoformat()].append(row)
                  for day,rows in by_day.items():
                      merge_news(data_root/t/'news'/'yfinance'/f'{day}.json',rows); saved+=len(rows)
                  # Use the repository's existing free RSS source only when Yahoo has no
                  # usable recent headlines. Never store RSS under a Yahoo/Finnhub label.
                  if (not by_day and t in fallback_tickers and rss_empty_streak < 5
                          and time.monotonic()-fallback_started < 900):
                      from market_sentiment.v5_news import google_news_rss
                      rss_attempts += 1
                      fallback = google_news_rss(t, days=window_days, count=20)
                      rss_by_day=defaultdict(list)
                      for row in fallback:
                          ts=norm_ts(row.get('ts'))
                          title=str(row.get('title') or row.get('headline') or '').strip()
                          source=str(row.get('source') or 'Google News')
                          suffix=' - '+source
                          if title.endswith(suffix):
                              title=title[:-len(suffix)].rstrip()
                          if not title or ts is None or ts<cutoff or ts>today+pd.Timedelta(hours=2):
                              continue
                          rss_by_day[ts.date().isoformat()].append({
                              'ts':ts.isoformat(), 'headline':title,
                              'summary':str(row.get('summary') or '').strip(),
                              'url':str(row.get('url') or ''), 'source':source,
                              'provider':'google_news_rss',
                          })
                      for day,rows in rss_by_day.items():
                          merge_news(data_root/t/'news'/'google_news_rss'/f'{day}.json',rows)
                          rss_saved+=len(rows)
                      rss_empty_streak=0 if rss_by_day else rss_empty_streak+1
                  if j%100==0: print(f'[YF NEWS] processed {j}/{len(tickers)}')
              print(f'[YF NEWS] merged_items={saved}')
              print(f'[RSS FALLBACK] attempted_tickers={rss_attempts} merged_items={rss_saved}')
              if saved == 0:
                  print('::warning::Yahoo returned no usable recent headlines; RSS fallback is separately attributed and missing sentiment is not neutral')


          def refresh_finnhub_news(tickers:list[str], data_root:Path, run_kind:str):
              if run_kind=='hourly':
                  print('[FINNHUB] hourly run: skip (Yahoo handles intraday refresh)'); return
              try: import finnhub
              except Exception:
                  print('[FINNHUB] package missing; skip'); return
              raw=os.environ.get('FINNHUB_TOKENS','').strip()
              tokens=[x.strip() for x in raw.split(',') if x.strip()]
              if not tokens:
                  tokens=[x for x in [os.environ.get('FINNHUB_TOKEN','').strip(),os.environ.get('FINNHUB_TOKEN_2','').strip()] if x]
              if not tokens:
                  print('[FINNHUB] no token configured; skip'); return
              days=30 if run_kind=='manual' else 10
              end=datetime.now(timezone.utc).date(); start=end-timedelta(days=days)
              token_i=0; client=finnhub.Client(api_key=tokens[token_i]); saved=0
              for j,t in enumerate(tickers,1):
                  arr=[]
                  for attempt in range(max(2,len(tokens)+1)):
                      try:
                          arr=client.company_news(t,_from=start.isoformat(),to=end.isoformat()) or []; break
                      except Exception as e:
                          msg=str(e)
                          if ('429' in msg or 'limit' in msg.lower()) and len(tokens)>1:
                              token_i=(token_i+1)%len(tokens); client=finnhub.Client(api_key=tokens[token_i]); time.sleep(0.5); continue
                          if attempt==0: time.sleep(0.25)
                  by_day=defaultdict(list)
                  for it in arr:
                      if not isinstance(it,dict): continue
                      try: ts=pd.Timestamp.fromtimestamp(int(it.get('datetime')),tz='UTC')
                      except Exception: continue
                      title=str(it.get('headline') or '').strip()
                      if not title: continue
                      by_day[ts.date().isoformat()].append({'ts':ts.isoformat(),'headline':title,'summary':str(it.get('summary') or title).strip(),
                          'url':str(it.get('url') or ''),'source':str(it.get('source') or ''),'provider':'finnhub'})
                  for day,rows in by_day.items():
                      merge_news(data_root/t/'news'/'finnhub'/f'{day}.json',rows); saved+=len(rows)
                  time.sleep(0.13)
                  if j%100==0: print(f'[FINNHUB] processed {j}/{len(tickers)}')
              print(f'[FINNHUB] merged_items={saved}')


          def main():
              ap=argparse.ArgumentParser(); ap.add_argument('--universe',default='data/sp500.csv'); ap.add_argument('--data-root',default='data'); ap.add_argument('--run-kind',choices=['hourly','daily','manual'],default='manual')
              a=ap.parse_args(); u=read_universe(Path(a.universe))
              if len(u)<100: raise RuntimeError(f'Universe too small: {len(u)}')
              root=Path(a.data_root)
              refresh_yahoo_news(u,root,a.run_kind)
              refresh_finnhub_news(u,root,a.run_kind)
              refresh_prices(u,root,a.run_kind)

          if __name__=='__main__': main()
          PY
          cat > /tmp/market-final/build_sentiment_v2.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import argparse
          import gzip
          import hashlib
          import json
          import math
          import os
          import re
          import unicodedata
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from typing import Any
          from urllib.parse import urlsplit

          ALGORITHM_VERSION = os.environ.get("SENTIMENT_ALGORITHM_VERSION", "dedup-finbert-v3-article-sentiment")
          SCHEMA_VERSION = 2
          NEWS_PROVIDERS = ("finnhub", "yfinance", "google_news_rss")


          def load_json(path: Path, default: Any) -> Any:
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return default


          def load_cache(path: Path) -> dict[str, Any]:
              if not path.exists():
                  return {
                      "schema_version": SCHEMA_VERSION,
                      "algorithm_version": ALGORITHM_VERSION,
                      "generated_at_utc": None,
                      "records": {},
                  }
              try:
                  with gzip.open(path, "rt", encoding="utf-8") as f:
                      obj = json.load(f)
              except (OSError, ValueError, EOFError) as error:
                  raise RuntimeError(f"Cannot read sentiment cache {path}; refusing to replace historical data") from error
              if not isinstance(obj, dict) or not isinstance(obj.get("records"), dict):
                  raise RuntimeError(f"Invalid sentiment cache structure: {path}")
              if any(not isinstance(days, dict) for days in obj["records"].values()):
                  raise RuntimeError(f"Invalid ticker-day mapping in sentiment cache: {path}")
              obj.setdefault("schema_version", SCHEMA_VERSION)
              obj.setdefault("algorithm_version", "unknown")
              return obj


          def record_is_current(rec: Any) -> bool:
              """A version string alone does not prove that article scores exist."""
              if not isinstance(rec, dict) or rec.get("algorithm_version") != ALGORITHM_VERSION:
                  return False
              n = rec.get("n_total")
              if isinstance(n, bool) or not isinstance(n, int) or n < 0:
                  return False
              articles = rec.get("articles")
              if not isinstance(articles, list) or len(articles) != n:
                  return False
              if n == 0:
                  return rec.get("score_mean") is None
              scores = []
              try:
                  mean = float(rec["score_mean"])
                  if not math.isfinite(mean) or not -1 <= mean <= 1:
                      return False
                  for article in articles:
                      if not isinstance(article, dict) or not str(article.get("sentiment_label") or "").strip():
                          return False
                      score = float(article["s"])
                      probs = article["probs"]
                      values = [float(probs[key]) for key in ("pos", "neu", "neg")]
                      if not math.isfinite(score) or not -1 <= score <= 1:
                          return False
                      if any(not math.isfinite(x) or not 0 <= x <= 1 for x in values):
                          return False
                      if abs(sum(values) - 1.0) > 1e-5 or abs(score - (values[0] - values[2])) > 2e-6:
                          return False
                      scores.append(score)
                  return abs(mean - sum(scores) / n) <= 2e-6
              except (KeyError, TypeError, ValueError, OverflowError):
                  return False


          def save_cache(path: Path, obj: dict[str, Any], *, finalize: bool = True) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              obj["schema_version"] = SCHEMA_VERSION
              if finalize:
                  incomplete = [(ticker, day) for ticker, days in obj["records"].items()
                                for day, rec in days.items() if not record_is_current(rec)]
                  if incomplete:
                      raise RuntimeError(f"Cannot finalize an incomplete sentiment migration: {incomplete[:5]}")
                  obj["algorithm_version"] = ALGORITHM_VERSION
              obj["generated_at_utc"] = datetime.now(timezone.utc).isoformat()
              obj["methodology"] = {
                  "article_dedup": "within ticker/day across Finnhub, Yahoo Finance and separately attributed public RSS by normalized headline or canonical URL",
                  "article_score": "ProsusAI/finbert: P(positive) - P(negative), headline text only",
                  "ticker_daily_aggregation": "equal-weight mean across unique headlines",
                  "no_news": "missing observation (score_mean=null), never neutral zero",
              }
              tmp = path.with_suffix(path.suffix + ".tmp")
              with gzip.open(tmp, "wt", encoding="utf-8", compresslevel=6) as f:
                  json.dump(obj, f, ensure_ascii=False, separators=(",", ":"), allow_nan=False)
              os.replace(tmp, path)


          def read_universe(path: Path) -> list[str]:
              import csv
              with path.open(newline="", encoding="utf-8") as f:
                  rows = list(csv.DictReader(f))
              if not rows:
                  return []
              col = next((c for c in rows[0].keys() if c.lower() in {"ticker", "symbol"}), None)
              if col is None:
                  return []
              out, seen = [], set()
              for row in rows:
                  t = str(row.get(col) or "").strip().upper().replace(".", "-")
                  if t and t not in seen:
                      seen.add(t)
                      out.append(t)
              return out


          def normalize_title(value: Any) -> str:
              s = unicodedata.normalize("NFKC", str(value or "")).lower()
              s = re.sub(r"https?://\S+", " ", s)
              s = s.replace("’", "'").replace("“", '"').replace("”", '"')
              s = re.sub(r"[^a-z0-9]+", " ", s)
              return re.sub(r"\s+", " ", s).strip()


          def canonical_url(value: Any) -> str:
              raw = str(value or "").strip()
              if not raw:
                  return ""
              try:
                  parts = urlsplit(raw)
                  host = (parts.hostname or "").lower()
                  if host.startswith("www."):
                      host = host[4:]
                  path = re.sub(r"/+", "/", parts.path or "/").rstrip("/")
                  # Finnhub proxy URLs do not identify the publisher article, so title dedup is primary.
                  return f"{host}{path}" if host else ""
              except Exception:
                  return ""


          class DSU:
              def __init__(self) -> None:
                  self.parent: list[int] = []

              def add(self) -> int:
                  i = len(self.parent)
                  self.parent.append(i)
                  return i

              def find(self, x: int) -> int:
                  while self.parent[x] != x:
                      self.parent[x] = self.parent[self.parent[x]]
                      x = self.parent[x]
                  return x

              def union(self, a: int, b: int) -> int:
                  ra, rb = self.find(a), self.find(b)
                  if ra == rb:
                      return ra
                  self.parent[rb] = ra
                  return ra


          def dedup_items(items: list[dict[str, Any]]) -> list[dict[str, Any]]:
              """Deduplicate a ticker/day feed across and within providers."""
              dsu = DSU()
              title_owner: dict[str, int] = {}
              url_owner: dict[str, int] = {}
              rows: list[dict[str, Any]] = []

              for item in items:
                  title = str(item.get("headline") or item.get("title") or "").strip()
                  title_key = normalize_title(title)
                  if not title_key:
                      continue
                  url = str(item.get("url") or item.get("link") or "").strip()
                  url_key = canonical_url(url)
                  idx = dsu.add()
                  rows.append(
                      {
                          "idx": idx,
                          "title": title,
                          "title_key": title_key,
                          "url": url,
                          "url_key": url_key,
                          "provider": str(item.get("_provider") or item.get("provider") or ""),
                          "source": str(item.get("source") or ""),
                      }
                  )
                  owners = []
                  if title_key in title_owner:
                      owners.append(title_owner[title_key])
                  if url_key and url_key in url_owner:
                      owners.append(url_owner[url_key])
                  for owner in owners:
                      dsu.union(idx, owner)
                  root = dsu.find(idx)
                  title_owner[title_key] = root
                  if url_key:
                      url_owner[url_key] = root

              groups: dict[int, list[dict[str, Any]]] = {}
              for row in rows:
                  root = dsu.find(row["idx"])
                  groups.setdefault(root, []).append(row)

              out: list[dict[str, Any]] = []
              for members in groups.values():
                  # Prefer the most descriptive title if feeds differ slightly.
                  rep = max(members, key=lambda r: (len(r["title"]), r["title"]))
                  out.append(
                      {
                          "title": rep["title"],
                          "title_key": rep["title_key"],
                          "url": rep["url"],
                          "url_key": rep["url_key"],
                          "providers": sorted({m["provider"] for m in members if m["provider"]}),
                          "sources": sorted({m["source"] for m in members if m["source"]}),
                          "raw_duplicates": len(members),
                      }
                  )
              out.sort(key=lambda r: (r["title_key"], r["url_key"]))
              return out


          def collect_day(data_root: Path, ticker: str, day: str) -> tuple[list[dict[str, Any]], dict[str, int], str]:
              raw_items: list[dict[str, Any]] = []
              counts = {provider: 0 for provider in NEWS_PROVIDERS}
              fingerprint_rows: list[tuple[str, str, str]] = []

              for provider in NEWS_PROVIDERS:
                  path = data_root / ticker / "news" / provider / f"{day}.json"
                  arr = load_json(path, [])
                  if not isinstance(arr, list):
                      continue
                  for item in arr:
                      if not isinstance(item, dict):
                          continue
                      title = str(item.get("headline") or item.get("title") or "").strip()
                      if not normalize_title(title):
                          continue
                      url = str(item.get("url") or item.get("link") or "").strip()
                      row = dict(item)
                      row["_provider"] = provider
                      raw_items.append(row)
                      counts[provider] += 1
                      fingerprint_rows.append((provider, normalize_title(title), canonical_url(url)))

              payload = json.dumps(sorted(fingerprint_rows), ensure_ascii=False, separators=(",", ":"))
              fingerprint = hashlib.sha256(payload.encode("utf-8")).hexdigest()
              return raw_items, counts, fingerprint


          def daterange(days: int) -> tuple[str, str]:
              end = datetime.now(timezone.utc).date()
              start = end - timedelta(days=max(1, days) - 1)
              return start.isoformat(), end.isoformat()


          def scan(args: argparse.Namespace) -> None:
              cache_path = Path(args.cache)
              cache_existed = cache_path.exists()
              cache = load_cache(cache_path)
              records = cache.setdefault("records", {})
              universe = read_universe(Path(args.universe))
              migration = cache.get("algorithm_version") != ALGORITHM_VERSION or any(
                  not record_is_current(rec)
                  for ticker_days in records.values() for rec in ticker_days.values()
              )
              days = int(args.days)
              if not cache_existed or migration:
                  days = max(days, int(args.initial_days))
              start, end = daterange(days)
              if migration:
                  # Include retired constituents and every retained cache date, not only the
                  # normal hourly/daily window. A mixed V2/V3 cache also needs repair.
                  universe = list(dict.fromkeys(universe + sorted(records)))
                  retained_days = [str(day) for ticker_days in records.values() for day in ticker_days]
                  for day in retained_days:
                      if datetime.strptime(day, "%Y-%m-%d").date().isoformat() != day:
                          raise RuntimeError(f"Invalid retained cache date: {day}")
                      if day > end:
                          raise RuntimeError(f"Future retained cache date: {day}")
                  start = min([start] + retained_days)
                  print(f"SENTIMENT MIGRATION | from={cache.get('algorithm_version')} to={ALGORITHM_VERSION} range={start}..{end}")

              manifest: list[dict[str, Any]] = []
              touched = unchanged = empty = 0
              for ticker in universe:
                  t_rec = records.setdefault(ticker, {})
                  news_root = Path(args.data_root) / ticker / "news"
                  candidate_days: set[str] = set()
                  for provider in NEWS_PROVIDERS:
                      pdir = news_root / provider
                      if pdir.exists():
                          candidate_days.update(p.stem[:10] for p in pdir.glob("*.json") if start <= p.stem[:10] <= end)
                  candidate_days.update(str(day) for day in t_rec if start <= str(day) <= end)
                  for day in sorted(candidate_days):
                      raw_items, raw_counts, fingerprint = collect_day(Path(args.data_root), ticker, day)
                      dedup = dedup_items(raw_items)
                      current = t_rec.get(day) if isinstance(t_rec.get(day), dict) else {}
                      if record_is_current(current) and current.get("source_fingerprint") == fingerprint:
                          unchanged += 1
                          continue
                      if not dedup:
                          if migration and not record_is_current(current) and int(current.get("n_total", 0) or 0) > 0:
                              raise RuntimeError(
                                  f"Cannot migrate {ticker} {day}: original raw headlines are unavailable; "
                                  "refusing to erase a historical observation or invent article scores"
                              )
                          t_rec[day] = {
                              "date": day, "ticker": ticker, "algorithm_version": ALGORITHM_VERSION,
                              "source_fingerprint": fingerprint, "score_mean": None, "score_std": None,
                              "n_total": 0, "n_raw": int(sum(raw_counts.values())),
                              "n_duplicates": int(sum(raw_counts.values())),
                              "n_finnhub_raw": int(raw_counts["finnhub"]),
                              "n_yfinance_raw": int(raw_counts["yfinance"]),
                              "n_google_news_rss_raw": int(raw_counts["google_news_rss"]), "articles": [],
                          }
                          empty += 1
                      else:
                          manifest.append({
                              "ticker": ticker, "day": day, "source_fingerprint": fingerprint,
                              "raw_counts": raw_counts, "n_raw": len(raw_items), "articles": dedup,
                          })
                      touched += 1

              # Never label an old cache as V3 before inference and article-level validation
              # have succeeded. A failed migration leaves the committed cache untouched.
              if touched > 0 or not cache_existed or migration:
                  save_cache(cache_path, cache, finalize=not manifest)
              manifest_path = Path(args.manifest)
              manifest_path.parent.mkdir(parents=True, exist_ok=True)
              manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
              print(f"SENTIMENT SCAN | range={start}..{end} universe={len(universe)} pending={len(manifest)} "
                    f"unchanged={unchanged} empty={empty} touched={touched}")


          def prediction_record(per: Any) -> dict[str, Any]:
              """Validate all three FinBERT probabilities before persisting any result."""
              if not isinstance(per, list) or len(per) != 3:
                  raise RuntimeError("FinBERT must return all three class probabilities")
              try:
                  labels = {str(row["label"]).lower(): float(row["score"]) for row in per}
                  if set(labels) != {"positive", "neutral", "negative"}:
                      raise ValueError("unexpected labels")
                  pos, neu, neg = (labels[k] for k in ("positive", "neutral", "negative"))
                  if any(not math.isfinite(v) or not 0 <= v <= 1 for v in (pos, neu, neg)):
                      raise ValueError("invalid probability")
                  if abs(pos + neu + neg - 1.0) > 1e-5:
                      raise ValueError("probabilities do not sum to one")
              except (KeyError, TypeError, ValueError, OverflowError) as error:
                  raise RuntimeError("Invalid FinBERT class probabilities") from error
              score = pos - neg
              label = ("Strong Positive" if score >= .4 else "Positive" if score >= .1 else
                       "Strong Negative" if score <= -.4 else "Negative" if score <= -.1 else "Neutral")
              return {"s": score, "sentiment_label": label, "probs": {"pos": pos, "neu": neu, "neg": neg}}


          def score_headlines(clf: Any, text_by_key: dict[str, str], checkpoint: Path,
                              batch_size: int, *, model_revision: str,
                              chunk_size: int = 256) -> dict[str, dict[str, Any]]:
              """Checkpoint validated inference, not aggregates, after every bounded chunk.

              Exact model revision and exact input text are part of the key. An interrupted
              run can reuse committed chunks, while changed inputs are always re-inferred.
              This disposable SQLite cache never changes the historical sentiment cache.
              """
              import sqlite3
              import time

              if batch_size < 1 or chunk_size < 1:
                  raise ValueError("Inference batch and chunk sizes must be positive")
              checkpoint.parent.mkdir(parents=True, exist_ok=True)
              namespace = f"{ALGORITHM_VERSION}|ProsusAI/finbert|{model_revision}"
              started = time.monotonic()
              result: dict[str, dict[str, Any]] = {}
              missing = []
              connection = sqlite3.connect(checkpoint)
              try:
                  connection.execute("PRAGMA synchronous=FULL")
                  connection.execute("CREATE TABLE IF NOT EXISTS predictions "
                                     "(namespace TEXT NOT NULL, digest TEXT NOT NULL, "
                                     "pos REAL NOT NULL, neu REAL NOT NULL, neg REAL NOT NULL, "
                                     "PRIMARY KEY(namespace, digest))")
                  connection.commit()
                  for key in sorted(text_by_key):
                      text = text_by_key[key]
                      digest = hashlib.sha256(text.encode("utf-8")).hexdigest()
                      cached = connection.execute(
                          "SELECT pos, neu, neg FROM predictions WHERE namespace=? AND digest=?",
                          (namespace, digest),
                      ).fetchone()
                      if cached is not None:
                          try:
                              result[key] = prediction_record([
                                  {"label": label, "score": value}
                                  for label, value in zip(("positive", "neutral", "negative"), cached)
                              ])
                              continue
                          except RuntimeError:
                              # Recompute an invalid disposable score; never trust it.
                              pass
                      missing.append((key, text, digest))
                  print(f"SENTIMENT CHECKPOINT | reused={len(result)} pending={len(missing)} "
                        f"model_revision={model_revision}", flush=True)
                  reused = len(result)
                  for offset in range(0, len(missing), chunk_size):
                      chunk = missing[offset:offset + chunk_size]
                      predictions = clf([text for _, text, _ in chunk], batch_size=batch_size)
                      if not isinstance(predictions, list) or len(predictions) != len(chunk):
                          raise RuntimeError("FinBERT output length mismatch")
                      validated = [prediction_record(per) for per in predictions]
                      # Validate the entire chunk before its transaction is committed.
                      with connection:
                          connection.executemany(
                              "INSERT OR REPLACE INTO predictions VALUES (?, ?, ?, ?, ?)",
                              [(namespace, digest, pred["probs"]["pos"], pred["probs"]["neu"],
                                pred["probs"]["neg"])
                               for (_, _, digest), pred in zip(chunk, validated)],
                          )
                      for (key, _, _), pred in zip(chunk, validated):
                          result[key] = pred
                      print(f"SENTIMENT PROGRESS | completed={len(result)}/{len(text_by_key)} "
                            f"reused={reused} elapsed_seconds={time.monotonic()-started:.1f}", flush=True)
              finally:
                  connection.close()
              return result


          def score_manifest(args: argparse.Namespace) -> None:
              manifest_path = Path(args.manifest)
              manifest = load_json(manifest_path, [])
              if not isinstance(manifest, list):
                  raise RuntimeError("Invalid sentiment manifest")
              if not manifest:
                  print("SENTIMENT SCORE | no changed ticker/day records")
                  return

              from transformers import AutoModelForSequenceClassification, AutoTokenizer, pipeline

              model_name = "ProsusAI/finbert"
              tokenizer = AutoTokenizer.from_pretrained(model_name)
              model = AutoModelForSequenceClassification.from_pretrained(model_name)
              clf = pipeline(
                  "text-classification",
                  model=model,
                  tokenizer=tokenizer,
                  top_k=None,
                  truncation=True,
              )

              # Score each unique normalized headline once globally. A repeated headline across
              # providers/tickers/dates receives the same model score and is not re-inferred.
              text_by_key: dict[str, str] = {}
              for rec in manifest:
                  for article in rec.get("articles", []):
                      key = str(article.get("title_key") or "")
                      title = str(article.get("title") or "")
                      if key and title:
                          if key not in text_by_key or len(title) > len(text_by_key[key]):
                              text_by_key[key] = title

              checkpoint = Path(getattr(args, "checkpoint", "") or (str(args.cache) + ".scores.sqlite3"))
              model_revision = str(getattr(getattr(model, "config", None), "_commit_hash", None) or f"unversioned-{os.getpid()}")
              score_by_key = score_headlines(clf, text_by_key, checkpoint,
                                            max(1, int(args.batch_size)), model_revision=model_revision)

              cache_path = Path(args.cache)
              cache = load_cache(cache_path)
              records = cache.setdefault("records", {})
              for rec in manifest:
                  ticker = str(rec["ticker"])
                  day = str(rec["day"])
                  scores: list[float] = []
                  scored_articles: list[dict[str, Any]] = []
                  for article in rec.get("articles", []):
                      key = str(article.get("title_key") or "")
                      pred = score_by_key.get(key)
                      if pred is None:
                          raise RuntimeError(f"Missing FinBERT prediction for {key!r}")
                      s_val = float(pred["s"])
                      scores.append(s_val)
                      scored_articles.append(
                          {
                              "title_key": key,
                              "title": str(article.get("title") or ""),
                              "url": str(article.get("url") or ""),
                              "providers": article.get("providers") or [],
                              "sources": article.get("sources") or [],
                              "raw_duplicates": int(article.get("raw_duplicates", 1) or 1),
                              "s": round(s_val, 6),
                              "sentiment_label": str(pred["sentiment_label"]),
                              "probs": {
                                  "pos": round(float(pred["probs"]["pos"]), 6),
                                  "neu": round(float(pred["probs"]["neu"]), 6),
                                  "neg": round(float(pred["probs"]["neg"]), 6),
                              },
                          }
                      )
                  if not scores:
                      score_mean = None
                      score_std = None
                      n_total = 0
                  else:
                      score_mean = sum(scores) / len(scores)
                      if len(scores) > 1:
                          mu = score_mean
                          score_std = math.sqrt(sum((x - mu) ** 2 for x in scores) / (len(scores) - 1))
                      else:
                          score_std = 0.0
                      n_total = len(scores)

                  raw_counts = rec.get("raw_counts") or {}
                  n_raw = int(rec.get("n_raw") or 0)
                  records.setdefault(ticker, {})[day] = {
                      "date": day,
                      "ticker": ticker,
                      "algorithm_version": ALGORITHM_VERSION,
                      "source_fingerprint": str(rec.get("source_fingerprint") or ""),
                      "score_mean": round(float(score_mean), 6) if score_mean is not None else None,
                      "score_std": round(float(score_std), 6) if score_std is not None else None,
                      "n_total": int(n_total),
                      "n_raw": n_raw,
                      "n_duplicates": max(0, n_raw - int(n_total)),
                      "n_finnhub_raw": int(raw_counts.get("finnhub", 0) or 0),
                      "n_yfinance_raw": int(raw_counts.get("yfinance", 0) or 0),
                      "n_google_news_rss_raw": int(raw_counts.get("google_news_rss", 0) or 0),
                      "articles": scored_articles,
                  }

              save_cache(cache_path, cache)
              print(f"SENTIMENT SCORE OK | updated_ticker_days={len(manifest)}")


          def validate(args: argparse.Namespace) -> None:
              cache = load_cache(Path(args.cache))
              if cache.get("algorithm_version") != ALGORITHM_VERSION:
                  raise RuntimeError("Sentiment migration has not completed")
              incomplete = [(ticker, day) for ticker, days in cache["records"].items()
                            for day, rec in days.items() if not record_is_current(rec)]
              if incomplete:
                  raise RuntimeError(f"Invalid or unmigrated article sentiment records: {incomplete[:5]}")
              records = cache.get("records") or {}
              total = 0
              observed = 0
              nonzero = 0
              duplicate_removed = 0
              bad_no_news = 0
              for ticker, days in records.items():
                  if not isinstance(days, dict):
                      continue
                  for day, rec in days.items():
                      if not isinstance(rec, dict):
                          continue
                      total += 1
                      n = int(rec.get("n_total", 0) or 0)
                      score = rec.get("score_mean")
                      if n <= 0:
                          if score is not None:
                              bad_no_news += 1
                          continue
                      observed += 1
                      x = float(score)
                      if not math.isfinite(x) or x < -1.000001 or x > 1.000001:
                          raise RuntimeError(f"Invalid sentiment score {ticker} {day}: {score}")
                      if abs(x) > 1e-12:
                          nonzero += 1
                      duplicate_removed += int(rec.get("n_duplicates", 0) or 0)
              if bad_no_news:
                  raise RuntimeError(f"{bad_no_news} no-news records incorrectly contain a numeric score")
              if observed < 100:
                  raise RuntimeError(f"Too few observed sentiment records in sentiment cache: {observed}")
              if nonzero < max(20, int(observed * 0.05)):
                  raise RuntimeError(f"Suspicious sentiment cache: only {nonzero}/{observed} observed records are nonzero")
              print(
                  f"SENTIMENT CACHE OK | records={total} observed={observed} "
                  f"nonzero={nonzero} duplicate_articles_removed={duplicate_removed}"
              )


          def main() -> None:
              ap = argparse.ArgumentParser()
              ap.add_argument("mode", choices=["scan", "score", "validate"])
              ap.add_argument("--universe", default="data/sp500.csv")
              ap.add_argument("--data-root", default="data")
              ap.add_argument("--cache", default="data/derived/sentiment_v2.json.gz")
              ap.add_argument("--manifest", default="/tmp/sentiment_v2_manifest.json")
              ap.add_argument("--days", type=int, default=14)
              ap.add_argument("--initial-days", type=int, default=365)
              ap.add_argument("--batch-size", type=int, default=64)
              ap.add_argument("--checkpoint", default="")
              args = ap.parse_args()
              if args.mode == "scan":
                  scan(args)
              elif args.mode == "score":
                  score_manifest(args)
              else:
                  validate(args)


          if __name__ == "__main__":
              main()
