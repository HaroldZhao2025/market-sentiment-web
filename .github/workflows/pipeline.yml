          def load_json(path: Path, default: Any) -> Any:
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return default


          def load_cache(path: Path) -> dict[str, Any]:
              try:
                  with gzip.open(path, "rt", encoding="utf-8") as f:
                      obj = json.load(f)
              except Exception:
                  return {}
              return obj if isinstance(obj, dict) else {}


          def atomic_json(path: Path, obj: Any) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              fd, tmp_name = tempfile.mkstemp(prefix=f".{path.name}.", suffix=".tmp", dir=str(path.parent))
              try:
                  with os.fdopen(fd, "w", encoding="utf-8") as f:
                      json.dump(obj, f, ensure_ascii=False, indent=2, allow_nan=False)
                      f.flush()
                      os.fsync(f.fileno())
                  os.replace(tmp_name, path)
              except Exception:
                  try:
                      os.unlink(tmp_name)
                  except FileNotFoundError:
                      pass
                  raise


          def safe_float(v: Any) -> float | None:
              try:
                  x = float(v)
              except (TypeError, ValueError):
                  return None
              return x if math.isfinite(x) else None


          def valid_day(v: Any) -> str | None:
              s = str(v or "")[:10]
              try:
                  return datetime.strptime(s, "%Y-%m-%d").date().isoformat()
              except Exception:
                  return None


          def read_universe(path: Path) -> list[str]:
              with path.open(newline="", encoding="utf-8") as f:
                  rows = list(csv.DictReader(f))
              if not rows:
                  return []
              col = next((c for c in rows[0].keys() if c.lower() in {"ticker", "symbol"}), None)
              if col is None:
                  return []
              out, seen = [], set()
              for row in rows:
                  t = str(row.get(col) or "").strip().upper().replace(".", "-")
                  if t and t not in seen:
                      seen.add(t)
                      out.append(t)
              return out


          def read_prices(data_root: Path, ticker: str, cutoff: str) -> list[tuple[str, float]]:
              arr = load_json(data_root / ticker / "price" / "daily.json", [])
              if not isinstance(arr, list):
                  return []
              pmap: dict[str, float] = {}
              for row in arr:
                  if not isinstance(row, dict):
                      continue
                  d = valid_day(row.get("date"))
                  p = safe_float(row.get("close"))
                  if d and d >= cutoff and p is not None and p > 0:
                      pmap[d] = p
              return sorted(pmap.items())


          def records_for_ticker(cache_records: dict[str, Any], ticker: str) -> list[tuple[str, float, int]]:
              days = cache_records.get(ticker)
              if not isinstance(days, dict):
                  return []
              out = []
              for day, rec in days.items():
                  if not isinstance(rec, dict):
                      continue
                  d = valid_day(rec.get("date") or day)
                  x = safe_float(rec.get("score_mean"))
                  try:
                      n = int(rec.get("n_total", 0) or 0)
                  except Exception:
                      n = 0
                  if d and x is not None and n > 0:
                      out.append((d, x, n))
              return sorted(out)


          def map_to_trading_days(
              trading_days: list[str],
              observations: list[tuple[str, float, int]],
          ) -> dict[str, dict[str, Any]]:
              """Map calendar news day to same-or-next trading day; combine by unique-news count."""
              if not trading_days or not observations:
                  return {}
              num: dict[str, float] = defaultdict(float)
              den: dict[str, int] = defaultdict(int)
              source_days: dict[str, list[str]] = defaultdict(list)
              for day, score, n in observations:
                  i = bisect.bisect_left(trading_days, day)
                  if i >= len(trading_days):
                      continue
                  td = trading_days[i]
                  w = max(1, int(n))
                  num[td] += float(score) * w
                  den[td] += w
                  source_days[td].append(day)
              return {
                  d: {
                      "score": num[d] / den[d],
                      "n_total": int(den[d]),
                      "source_days": sorted(set(source_days[d])),
                  }
                  for d in num
                  if den[d] > 0
              }


          def normalize_title(value: Any) -> str:
              s = unicodedata.normalize("NFKC", str(value or "")).lower()
              s = re.sub(r"https?://\S+", " ", s)
              s = re.sub(r"[^a-z0-9]+", " ", s)
              return re.sub(r"\s+", " ", s).strip()


          def canonical_url(value: Any) -> str:
              raw = str(value or "").strip()
              if not raw:
                  return ""
              try:
                  p = urlsplit(raw)
                  host = (p.hostname or "").lower()
                  if host.startswith("www."):
                      host = host[4:]
                  return f"{host}{re.sub(r'/+', '/', p.path or '/').rstrip('/')}"
              except Exception:
                  return ""


          def recent_news(
              data_root: Path,
              ticker: str,
              cache_records: dict[str, Any],
              limit: int = 10,
          ) -> list[dict[str, Any]]:
              """Return only recent deduplicated headlines with article-level FinBERT scores."""
              lookup: dict[str, dict[str, Any]] = {}
              ticker_days = cache_records.get(ticker)
              if isinstance(ticker_days, dict):
                  for rec in ticker_days.values():
                      if not isinstance(rec, dict):
                          continue
                      articles = rec.get("articles")
                      if not isinstance(articles, list):
                          continue
                      for article in articles:
                          if not isinstance(article, dict):
                              continue
                          key = str(article.get("title_key") or "")
                          score = safe_float(article.get("s"))
                          if key and score is not None:
                              lookup[key] = article

              rows: list[dict[str, Any]] = []
              seen_titles: set[str] = set()
              seen_urls: set[str] = set()
              for provider in ("finnhub", "yfinance", "google_news_rss"):
                  root = data_root / ticker / "news" / provider
                  if not root.exists():
                      continue
                  for p in sorted(root.glob("*.json"), reverse=True)[:14]:
                      arr = load_json(p, [])
                      if not isinstance(arr, list):
                          continue
                      for item in arr:
                          if not isinstance(item, dict):
                              continue
                          title = str(item.get("headline") or item.get("title") or "").strip()
                          title_key = normalize_title(title)
                          if not title_key:
                              continue
                          scored = lookup.get(title_key)
                          if scored is None:
                              continue

                          url = str(item.get("url") or item.get("link") or "").strip()
                          url_key = canonical_url(url)
                          if title_key in seen_titles or (url_key and url_key in seen_urls):
                              continue
                          seen_titles.add(title_key)
                          if url_key:
                              seen_urls.add(url_key)

                          score = float(scored["s"])
                          row: dict[str, Any] = {
                              "ts": str(item.get("ts") or ""),
                              "title": title,
                              "url": url,
                              "source": str(item.get("source") or provider),
                              "provider": provider,
                              "s": round(score, 6),
                              "sentiment_label": str(scored.get("sentiment_label") or ""),
                          }
                          probs = scored.get("probs")
                          if isinstance(probs, dict):
                              row["probs"] = {
                                  "pos": round(float(probs.get("pos", 0.0)), 6),
                                  "neu": round(float(probs.get("neu", 0.0)), 6),
                                  "neg": round(float(probs.get("neg", 0.0)), 6),
                              }
                          rows.append(row)

              rows.sort(key=lambda r: (r.get("ts") or "", r.get("title") or ""), reverse=True)
              return rows[:limit]


          def build_ticker_snapshots(
              universe: list[str],
              data_root: Path,
              public_root: Path,
              portfolio_input_root: Path,
              cache_records: dict[str, Any],
              cutoff: str,
          ) -> tuple[dict[str, list[tuple[str, float]]], dict[str, dict[str, dict[str, Any]]], list[str]]:
              ticker_pub = public_root / "ticker"
              if ticker_pub.exists():
                  shutil.rmtree(ticker_pub)
              ticker_pub.mkdir(parents=True, exist_ok=True)
              p_ticker = portfolio_input_root / "ticker"
              if p_ticker.exists():
                  shutil.rmtree(p_ticker)
              p_ticker.mkdir(parents=True, exist_ok=True)

              prices_by_ticker: dict[str, list[tuple[str, float]]] = {}
              mapped_by_ticker: dict[str, dict[str, dict[str, Any]]] = {}
              written: list[str] = []

              for ticker in universe:
                  prices = read_prices(data_root, ticker, cutoff)
                  if len(prices) < 20:
                      continue
                  trading_days = [d for d, _ in prices]
                  mapped = map_to_trading_days(trading_days, records_for_ticker(cache_records, ticker))
                  if not mapped:
                      continue

                  first_obs = min(mapped)
                  active_prices = [(d, p) for d, p in prices if d >= first_obs]
                  if len(active_prices) < 10:
                      continue

                  last_score: float | None = None
                  last_obs_day: str | None = None
                  age = 0
                  dates: list[str] = []
                  price_arr: list[float] = []
                  display_s: list[float] = []
                  observed_flags: list[bool] = []
                  n_total_arr: list[int] = []
                  age_arr: list[int] = []
                  portfolio_s: list[float | None] = []

                  for d, p in active_prices:
                      obs = mapped.get(d)
                      if obs is not None:
                          last_score = float(obs["score"])
                          last_obs_day = d
                          age = 0
                          observed = True
                          n_total = int(obs["n_total"])
                          p_sig: float | None = last_score
                      else:
                          if last_score is None:
                              continue
                          age += 1
                          observed = False
                          n_total = 0
                          p_sig = None

                      dates.append(d)
                      price_arr.append(round(float(p), 6))
                      # Frontend currently coerces null -> 0. Keep a numeric display state,
                      # while sentiment_observed/n_total preserve the distinction.
                      display_s.append(round(float(last_score), 6))
                      observed_flags.append(observed)
                      n_total_arr.append(n_total)
                      age_arr.append(age)
                      portfolio_s.append(round(float(p_sig), 6) if p_sig is not None else None)

                  if len(dates) < 10:
                      continue

                  obj = {
                      "schema_version": 4,
                      "ticker": ticker,
                      "dates": dates,
                      "price": price_arr,
                      "S": display_s,
                      "sentiment": display_s,
                      "sentiment_observed": observed_flags,
                      "n_total": n_total_arr,
                      "sentiment_age_trading_days": age_arr,
                      "latest_sentiment_date": last_obs_day,
                      "sentiment_display_semantics": (
                          "S is the last observed real FinBERT ticker sentiment carried forward for display only; "
                          "sentiment_observed and n_total identify dates with new unique-news observations."
                      ),
                      "news": recent_news(data_root, ticker, cache_records, limit=10),
                  }
                  atomic_json(ticker_pub / f"{ticker}.json", obj)

                  p_obj = {
                      "ticker": ticker,
                      "dates": dates,
                      "price": price_arr,
                      "S": portfolio_s,
                      "sentiment": portfolio_s,
                  }
                  atomic_json(p_ticker / f"{ticker}.json", p_obj)
                  prices_by_ticker[ticker] = active_prices
                  mapped_by_ticker[ticker] = mapped
                  written.append(ticker)

              atomic_json(public_root / "_tickers.json", written)
              return prices_by_ticker, mapped_by_ticker, written


          def read_spx_prices(data_root: Path, cutoff: str) -> tuple[dict[str, Any], list[dict[str, Any]]]:
              src = load_json(data_root / "SPX" / "sp500_index.json", {})
              if not isinstance(src, dict) or not isinstance(src.get("daily"), list):
                  raise RuntimeError("data/SPX/sp500_index.json is missing or invalid")
              pmap: dict[str, float] = {}
              for row in src["daily"]:
                  if not isinstance(row, dict):
                      continue
                  d = valid_day(row.get("date"))
                  close = safe_float(row.get("close"))
                  if close is None:
                      for k, v in row.items():
                          if str(k).startswith("close_"):
                              close = safe_float(v)
                              if close is not None:
                                  break
                  if d and d >= cutoff and close is not None and close > 1000:
                      pmap[d] = close
              if len(pmap) < 20:
                  raise RuntimeError(f"Too few valid SPX price rows: {len(pmap)}")
              daily = [{"date": d, "close": float(pmap[d])} for d in sorted(pmap)]
              return src, daily


          def read_current_weights(data_root: Path) -> tuple[dict[str, float], dict[str, dict[str, Any]]]:
              heat = load_json(data_root / "SPX" / "sp500_heatmap.json", {})
              tiles = heat.get("tiles") if isinstance(heat, dict) else None
              if not isinstance(tiles, list):
                  raise RuntimeError("data/SPX/sp500_heatmap.json is missing tiles")
              raw: dict[str, float] = {}
              tile_meta: dict[str, dict[str, Any]] = {}
              for tile in tiles:
                  if not isinstance(tile, dict):
                      continue
                  sym = str(tile.get("symbol") or "").strip().upper().replace(".", "-")
                  w = safe_float(tile.get("weight"))
                  if not sym:
                      continue
                  tile_meta[sym] = dict(tile)
                  if w is not None and w > 0:
                      raw[sym] = w
              total = sum(raw.values())
              if len(raw) < 100 or total <= 0:
                  raise RuntimeError(f"Too few usable current-cap weights: {len(raw)}")
              weights = {k: v / total for k, v in raw.items()}
              return weights, tile_meta


          def map_cache_to_spx_days(
              cache_records: dict[str, Any],
              spx_days: list[str],
              universe: list[str],
          ) -> dict[str, dict[str, dict[str, Any]]]:
              out: dict[str, dict[str, dict[str, Any]]] = {}
              for ticker in universe:
                  obs = records_for_ticker(cache_records, ticker)
                  if not obs:
                      continue
                  mapped = map_to_trading_days(spx_days, obs)
                  if mapped:
                      out[ticker] = mapped
              return out


          def rebuild_spx(
              data_root: Path,
              public_root: Path,
              cache_records: dict[str, Any],
              universe: list[str],
              cutoff: str,
          ) -> dict[str, Any]:
              src, daily_prices = read_spx_prices(data_root, cutoff)
              spx_days = [r["date"] for r in daily_prices]
              weights, tile_meta = read_current_weights(data_root)
              mapped = map_cache_to_spx_days(cache_records, spx_days, universe)
              weight_den_all = sum(weights.values())
              eligible_tickers = len(weights)

              daily_out = []
              for row in daily_prices:
                  d = row["date"]
                  obs = []
                  for ticker, w in weights.items():
                      rec = mapped.get(ticker, {}).get(d)
                      if rec is None:
                          continue
                      score = safe_float(rec.get("score"))
                      n = int(rec.get("n_total", 0) or 0)
                      if score is None or n <= 0:
                          continue
                      obs.append((ticker, w, score, n))
                  den = sum(w for _, w, _, _ in obs)
                  cap_sent = sum(w * s for _, w, s, _ in obs) / den if den > 0 else None
                  eq_sent = sum(s for _, _, s, _ in obs) / len(obs) if obs else None
                  n_news = sum(n for _, _, _, n in obs)
                  daily_out.append(
                      {
                          "date": d,
                          "close": float(row["close"]),
                          # Compatibility alias for the current frontend, which searches close_*.
                          "close_^GSPC": float(row["close"]),
                          "sentiment_cap_weighted": round(float(cap_sent), 8) if cap_sent is not None else None,
                          "sentiment_equal_weighted": round(float(eq_sent), 8) if eq_sent is not None else None,
                          "sentiment_coverage_market_cap": round(float(den / weight_den_all), 8) if weight_den_all else 0.0,
                          "sentiment_observed_tickers": int(len(obs)),
                          "sentiment_coverage_tickers": round(float(len(obs) / eligible_tickers), 8) if eligible_tickers else 0.0,
                          "sentiment_unique_news_count": int(n_news),
                      }
                  )

              latest = daily_out[-1]
              asof = latest["date"]
              sentiment_asof = next((row["date"] for row in reversed(daily_out)
                                     if row["sentiment_cap_weighted"] is not None), None)
              if sentiment_asof is None:
                  raise RuntimeError("No observed S&P sentiment history")
              freshness = {
                  "price_asof": asof,
                  "sentiment_asof": sentiment_asof,
                  "sentiment_status": "available" if latest["sentiment_cap_weighted"] is not None else "unavailable",
              }
              tiles_out = []
              observed_tiles = 0
              nonzero_tiles = 0
              news_total = 0
              for ticker in sorted(tile_meta):
                  tile = dict(tile_meta[ticker])
                  rec = mapped.get(ticker, {}).get(asof)
                  if rec is not None and int(rec.get("n_total", 0) or 0) > 0:
                      score = float(rec["score"])
                      n = int(rec["n_total"])
                      tile["sentiment"] = round(score, 6)
                      tile["n_total"] = n
                      observed_tiles += 1
                      news_total += n
                      if abs(score) > 1e-12:
                          nonzero_tiles += 1
                  else:
                      tile["sentiment"] = None
                      tile["n_total"] = 0
                  tiles_out.append(tile)

              heat_src = load_json(data_root / "SPX" / "sp500_heatmap.json", {})
              stats = dict(heat_src.get("stats") or {}) if isinstance(heat_src, dict) else {}
              stats.update(
                  {
                      "n_tiles": len(tiles_out),
                      "missing_sentiment": len(tiles_out) - observed_tiles,
                      "observed_sentiment": observed_tiles,
                      "nonzero_observed_sentiment": nonzero_tiles,
                      "unique_news_count": news_total,
                      "coverage_market_cap": latest["sentiment_coverage_market_cap"],
                      "coverage_tickers": latest["sentiment_coverage_tickers"],
                  }
              )
              heat_out = {
                  **freshness,
                  "schema_version": 3,
                  "symbol": "SPX",
                  "name": "S&P 500 Index",
                  "asof": asof,
                  "updated_at_utc": datetime.now(timezone.utc).isoformat(),
                  "aggregation": {
                      "article_level": "deduplicate ticker/day news across Finnhub, Yahoo Finance and public RSS, then FinBERT P(pos)-P(neg)",
                      "ticker_day": "equal-weight mean of unique headline scores",
                      "index_day": "current-market-cap snapshot weights, renormalized only across tickers with an observed sentiment that day",
                      "no_news": "missing; never inserted as zero",
                      "weighting_note": (
                          "Historical rows use the current market-cap snapshot as a cross-sectional weighting convention. "
                          "This is not a point-in-time historical constituent-weight series."
                      ),
                  },
                  "stats": stats,
                  "tiles": tiles_out,
              }

              index_out = {
                  **freshness,
                  "schema_version": 3,
                  "symbol": str(src.get("symbol") or "SPX"),
                  "name": str(src.get("name") or "S&P 500 Index"),
                  "price_symbol": str(src.get("price_symbol") or "^GSPC"),
                  "price_symbol_candidates": src.get("price_symbol_candidates") or ["^GSPC", "^SPX", "SPY"],
                  "sentiment_aggregation": heat_out["aggregation"],
                  "daily": daily_out,
              }

              spx_dir = public_root / "SPX"
              spx_dir.mkdir(parents=True, exist_ok=True)
              atomic_json(spx_dir / "sp500_index.json", index_out)
              atomic_json(spx_dir / "sp500_heatmap.json", heat_out)
              return {
                  "latest_date": asof,
                  "latest_close": float(latest["close"]),
                  "latest_sentiment": latest["sentiment_cap_weighted"],
                  "latest_coverage_market_cap": latest["sentiment_coverage_market_cap"],
                  "latest_observed_tickers": latest["sentiment_observed_tickers"],
                  "latest_unique_news": latest["sentiment_unique_news_count"],
                  "heatmap_observed": observed_tiles,
                  "heatmap_nonzero": nonzero_tiles,
              }


          def validate_spx_observation(sentiment: Any, observed: int, coverage: float) -> None:
              """Missing is valid only with exactly zero observed coverage, never fake zero."""
              if observed < 0 or not math.isfinite(coverage) or not 0 <= coverage <= 1.000001:
                  raise RuntimeError("Invalid S&P sentiment coverage")
              if observed == 0:
                  if sentiment is not None or coverage != 0:
                      raise RuntimeError("Unobserved S&P sentiment must be null with zero coverage")
                  print("::warning::Latest S&P sentiment unavailable; prices remain current and sentiment is not backfilled")
                  return
              if observed < 5 or coverage <= 0 or sentiment is None:
                  raise RuntimeError("Insufficient observed S&P sentiment coverage")
              value = float(sentiment)
              if not math.isfinite(value) or not -1 <= value <= 1:
                  raise RuntimeError("Invalid observed S&P sentiment score")


          def validate_public(
              public_root: Path,
              written: list[str],
              spx_summary: dict[str, Any],
          ) -> None:
              if len(written) < 100:
                  raise RuntimeError(f"Too few public ticker snapshots: {len(written)}")

              latest_real = 0
              latest_nonzero = 0
              for ticker in written:
                  obj = load_json(public_root / "ticker" / f"{ticker}.json", {})
                  dates = obj.get("dates") or []
                  prices = obj.get("price") or []
                  s = obj.get("S") or []
                  observed = obj.get("sentiment_observed") or []
                  counts = obj.get("n_total") or []
                  if not (len(dates) == len(prices) == len(s) == len(observed) == len(counts)):
                      raise RuntimeError(f"Ticker array contract mismatch: {ticker}")
                  if not dates:
                      raise RuntimeError(f"Empty ticker snapshot: {ticker}")
                  if not math.isfinite(float(prices[-1])) or float(prices[-1]) <= 0:
                      raise RuntimeError(f"Bad latest price: {ticker}")
                  if any(not math.isfinite(float(x)) for x in s):
                      raise RuntimeError(f"Non-finite display sentiment: {ticker}")
                  for flag, n in zip(observed, counts):
                      if bool(flag) != (int(n) > 0):
                          raise RuntimeError(f"Observed/count contract mismatch: {ticker}")
                  idx = next((i for i in range(len(observed) - 1, -1, -1) if observed[i]), None)
                  if idx is not None:
                      latest_real += 1
                      if abs(float(s[idx])) > 1e-12:
                          latest_nonzero += 1

              close = float(spx_summary["latest_close"])
              if close <= 1000:
                  raise RuntimeError(f"SPX price scale invalid: {close}")
              observed = int(spx_summary["latest_observed_tickers"])
              validate_spx_observation(spx_summary["latest_sentiment"], observed,
                                       float(spx_summary["latest_coverage_market_cap"]))
              if latest_real < 100 or latest_nonzero < 20:
                  raise RuntimeError(
                      f"Suspicious ticker sentiment coverage: latest_real={latest_real}, latest_nonzero={latest_nonzero}"
                  )

              print(
                  "SITE DATA OK | "
                  f"ticker_files={len(written)} latest_real_ticker_sentiment={latest_real} "
                  f"latest_nonzero_real_sentiment={latest_nonzero} "
                  f"SPX_date={spx_summary['latest_date']} SPX={close:.2f} "
                  f"SPX_sentiment={spx_summary['latest_sentiment']} "
                  f"SPX_mcap_coverage={spx_summary['latest_coverage_market_cap']:.4f} "
                  f"SPX_observed_tickers={observed} SPX_unique_news={spx_summary['latest_unique_news']}"
              )


          def main() -> None:
              ap = argparse.ArgumentParser()
              ap.add_argument("--universe", default="data/sp500.csv")
              ap.add_argument("--data-root", default="data")
              ap.add_argument("--public-root", default="apps/web/public/data")
              ap.add_argument("--cache", default="data/derived/sentiment_v2.json.gz")
              ap.add_argument("--portfolio-input", default="/tmp/portfolio-input")
              ap.add_argument("--days", type=int, default=365)
              args = ap.parse_args()

              universe = read_universe(Path(args.universe))
              if len(universe) < 100:
                  raise RuntimeError(f"Universe unexpectedly small: {len(universe)}")
              cache = load_cache(Path(args.cache))
              expected_algorithm = os.environ.get(
                  "SENTIMENT_ALGORITHM_VERSION",
                  "dedup-finbert-v3-article-sentiment",
              )
              actual_algorithm = str(cache.get("algorithm_version") or "")
              if actual_algorithm != expected_algorithm:
                  raise RuntimeError(
                      f"Unexpected sentiment cache version: {actual_algorithm!r}; "
                      f"expected {expected_algorithm!r}"
                  )
              cache_records = cache.get("records")
              if not isinstance(cache_records, dict):
                  raise RuntimeError("Sentiment v2 cache has no records")

              today = datetime.now(timezone.utc).date()
              cutoff = (today - timedelta(days=max(60, int(args.days)))).isoformat()
              public_root = Path(args.public_root)
              public_root.mkdir(parents=True, exist_ok=True)
              portfolio_input = Path(args.portfolio_input)
              if portfolio_input.exists():
                  shutil.rmtree(portfolio_input)
              portfolio_input.mkdir(parents=True, exist_ok=True)

              _, _, written = build_ticker_snapshots(
                  universe,
                  Path(args.data_root),
                  public_root,
                  portfolio_input,
                  cache_records,
                  cutoff,
              )
              spx_summary = rebuild_spx(
                  Path(args.data_root),
                  public_root,
                  cache_records,
                  universe,
                  cutoff,
              )
              validate_public(public_root, written, spx_summary)


          if __name__ == "__main__":
              main()
          PY
          cat > /tmp/market-final/build_research_input_v2.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import argparse
          import bisect
          import csv
          import gzip
          import json
          import math
          import os
          import shutil
          from collections import defaultdict
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from typing import Any


          def load_json(path: Path, default: Any) -> Any:
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return default


          def load_cache(path: Path) -> dict[str, Any]:
              try:
                  with gzip.open(path, "rt", encoding="utf-8") as f:
                      x = json.load(f)
                  return x if isinstance(x, dict) else {}
              except Exception:
                  return {}


          def finite(v: Any) -> float | None:
              try:
                  x = float(v)
              except (TypeError, ValueError):
                  return None
              return x if math.isfinite(x) else None


          def valid_day(v: Any) -> str | None:
              s = str(v or "")[:10]
              try:
                  return datetime.strptime(s, "%Y-%m-%d").date().isoformat()
              except Exception:
                  return None


          def read_universe(path: Path) -> list[str]:
              with path.open(newline="", encoding="utf-8") as f:
                  rows = list(csv.DictReader(f))
              if not rows:
                  return []
              col = next((c for c in rows[0].keys() if c.lower() in {"ticker", "symbol"}), None)
              if col is None:
                  return []
              out, seen = [], set()
              for row in rows:
                  t = str(row.get(col) or "").strip().upper().replace(".", "-")
                  if t and t not in seen:
                      seen.add(t)
                      out.append(t)
              return out


          def read_prices(data_root: Path, ticker: str, cutoff: str) -> list[tuple[str, float]]:
              arr = load_json(data_root / ticker / "price" / "daily.json", [])
              pmap = {}
              if isinstance(arr, list):
                  for row in arr:
                      if not isinstance(row, dict):
                          continue
                      d = valid_day(row.get("date"))
                      p = finite(row.get("close"))
                      if d and d >= cutoff and p is not None and p > 0:
                          pmap[d] = p
              return sorted(pmap.items())


          def observations(cache_records: dict[str, Any], ticker: str) -> list[tuple[str, float, int]]:
              days = cache_records.get(ticker)
              if not isinstance(days, dict):
                  return []
              out = []
              for day, rec in days.items():
                  if not isinstance(rec, dict):
                      continue
                  d = valid_day(rec.get("date") or day)
                  s = finite(rec.get("score_mean"))
                  n = int(rec.get("n_total", 0) or 0)
                  if d and s is not None and n > 0:
                      out.append((d, s, n))
              return sorted(out)


          def map_obs(trading_days: list[str], obs: list[tuple[str, float, int]]) -> dict[str, tuple[float, int]]:
              num: dict[str, float] = defaultdict(float)
              den: dict[str, int] = defaultdict(int)
              for d, s, n in obs:
                  i = bisect.bisect_left(trading_days, d)
                  if i >= len(trading_days):
                      continue
                  td = trading_days[i]
                  w = max(1, int(n))
                  num[td] += s * w
                  den[td] += w
              return {d: (num[d] / den[d], den[d]) for d in num if den[d] > 0}


          def main() -> None:
              ap = argparse.ArgumentParser()
              ap.add_argument("--universe", default="data/sp500.csv")
              ap.add_argument("--data-root", default="data")
              ap.add_argument("--cache", default="data/derived/sentiment_v2.json.gz")
              ap.add_argument("--out-root", default="/tmp/research-input")
              ap.add_argument("--days", type=int, default=365)
              args = ap.parse_args()

              cache = load_cache(Path(args.cache))
              expected_algorithm = os.environ.get(
                  "SENTIMENT_ALGORITHM_VERSION",
                  "dedup-finbert-v3-article-sentiment",
              )
              actual_algorithm = str(cache.get("algorithm_version") or "")
              if actual_algorithm != expected_algorithm:
                  raise RuntimeError(
                      f"Research sentiment cache version mismatch: {actual_algorithm!r}; "
                      f"expected {expected_algorithm!r}"
                  )
              records = cache.get("records")
              if not isinstance(records, dict):
                  raise RuntimeError("No sentiment cache records available for research")
              universe = read_universe(Path(args.universe))
              cutoff = (datetime.now(timezone.utc).date() - timedelta(days=max(180, int(args.days)))).isoformat()

              root = Path(args.out_root)
              if root.exists():
                  shutil.rmtree(root)
              ticker_dir = root / "ticker"
              ticker_dir.mkdir(parents=True, exist_ok=True)

              written = 0
              rows_total = 0
              observed_total = 0
              for ticker in universe:
                  prices = read_prices(Path(args.data_root), ticker, cutoff)
                  if len(prices) < 80:
                      continue
                  tdays = [d for d, _ in prices]
                  mapped = map_obs(tdays, observations(records, ticker))
                  if not mapped:
                      continue
                  first_obs = min(mapped)
                  active = [(d, p) for d, p in prices if d >= first_obs]
                  if len(active) < 80:
                      continue

                  dates = []
                  price_arr = []
                  s_arr = []
                  n_arr = []
                  observed_arr = []
                  for d, p in active:
                      rec = mapped.get(d)
                      # Research-only convention:
                      # a no-news trading day has zero *sentiment shock / activity*, not a measured neutral article.
                      # n_total and sentiment_observed preserve that distinction.
                      score = float(rec[0]) if rec is not None else 0.0
                      n = int(rec[1]) if rec is not None else 0
                      dates.append(d)
                      price_arr.append(round(float(p), 6))
                      s_arr.append(round(score, 6))
                      n_arr.append(n)
                      observed_arr.append(rec is not None)

                  obj = {
                      "ticker": ticker,
                      "dates": dates,
                      "price": price_arr,
                      "S": s_arr,
                      "sentiment": s_arr,
                      "n_total": n_arr,
                      "sentiment_observed": observed_arr,
                      "research_input_semantics": (
                          "Dense trading-day panel. On news-observation dates S is the deduplicated FinBERT ticker score; "
                          "on no-news trading dates S=0 denotes no sentiment shock/activity, while n_total=0 and "
                          "sentiment_observed=false explicitly distinguish this from a measured neutral-news score."
                      ),
                  }
                  (ticker_dir / f"{ticker}.json").write_text(
                      json.dumps(obj, ensure_ascii=False, separators=(",", ":"), allow_nan=False),
                      encoding="utf-8",
                  )
                  written += 1
                  rows_total += len(dates)
                  observed_total += sum(observed_arr)

              if written < 100:
                  raise RuntimeError(f"Too few research ticker panels: {written}")
              print(
                  f"RESEARCH INPUT OK | tickers={written} rows={rows_total} "
                  f"observed_sentiment_days={observed_total} avg_rows={rows_total/written:.1f}"
              )


          if __name__ == "__main__":
              main()
          PY
          cat > /tmp/market-final/upgrade_source.py <<'PY'
          #!/usr/bin/env python3
          # Intentionally does NOT modify React/TypeScript source at runtime.
          # The production pipeline fixes the homepage data contract instead.
          from __future__ import annotations
          import json
          from pathlib import Path

          def upgrade_package() -> bool:
              p = Path("apps/web/package.json")
              obj = json.loads(p.read_text(encoding="utf-8"))
              deps = obj.setdefault("dependencies", {})
              changed = False
              if deps.get("next") != "14.2.35":
                  print(f"[SOURCE] Next.js {deps.get('next')} -> 14.2.35")
                  deps["next"] = "14.2.35"
                  changed = True
              if changed:
                  p.write_text(json.dumps(obj, indent=2) + "\n", encoding="utf-8")
              return changed

          def main() -> None:
              changed = upgrade_package()
              print(f"[SOURCE] dependency_changed={changed}; homepage source left untouched")

          if __name__ == "__main__":
              main()
          PY
          cat > /tmp/market-final/validate_final_data.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations
          import json, math
          from pathlib import Path
          from typing import Any

          def load(p): return json.loads(Path(p).read_text(encoding='utf-8'))

          def validate_spx_observation(sentiment: Any, observed: int, coverage: float) -> None:
              """Missing is valid only with exactly zero observed coverage, never fake zero."""
              if observed < 0 or not math.isfinite(coverage) or not 0 <= coverage <= 1.000001:
                  raise RuntimeError("Invalid S&P sentiment coverage")
              if observed == 0:
                  if sentiment is not None or coverage != 0:
                      raise RuntimeError("Unobserved S&P sentiment must be null with zero coverage")
                  print("::warning::Latest S&P sentiment unavailable; prices remain current and sentiment is not backfilled")
                  return
              if observed < 5 or coverage <= 0 or sentiment is None:
                  raise RuntimeError("Insufficient observed S&P sentiment coverage")
              value = float(sentiment)
              if not math.isfinite(value) or not -1 <= value <= 1:
                  raise RuntimeError("Invalid observed S&P sentiment score")


          def main():
              pub=Path('apps/web/public/data')
              spx=load(pub/'SPX'/'sp500_index.json'); daily=spx.get('daily') or []
              root_spx=load(Path('data/SPX/sp500_index.json'))
              if root_spx != spx:
                  raise RuntimeError('Homepage/root SPX file differs from validated public SPX file')
              if not daily: raise RuntimeError('SPX daily empty')
              latest=daily[-1]
              close=float(latest.get('close'))
              alias=float(latest.get('close_^GSPC'))
              sent=latest.get('sentiment_cap_weighted')
              if close<=1000 or abs(close-alias)>1e-8: raise RuntimeError(f'SPX price contract invalid: {latest}')
              obs=int(latest.get('sentiment_observed_tickers',0) or 0)
              coverage=float(latest.get('sentiment_coverage_market_cap',0) or 0)
              validate_spx_observation(sent, obs, coverage)
              expected_asof = next((row["date"] for row in reversed(daily)
                                    if row.get("sentiment_cap_weighted") is not None), None)
              expected_status = "available" if sent is not None else "unavailable"
              if expected_asof is None or spx.get("sentiment_asof") != expected_asof:
                  raise RuntimeError("S&P sentiment observation timestamp is missing or inconsistent")
              if spx.get("price_asof") != latest["date"] or spx.get("sentiment_status") != expected_status:
                  raise RuntimeError("S&P price/sentiment freshness metadata is inconsistent")

              tickers=load(pub/'_tickers.json')
              real=0; nonzero=0; price_ok=0
              for t in tickers:
                  p=pub/'ticker'/f'{t}.json'
                  if not p.exists(): continue
                  o=load(p); dates=o.get('dates') or []; prices=o.get('price') or []; s=o.get('S') or []
                  observed=o.get('sentiment_observed') or []
                  counts=o.get('n_total') or []
                  if not (len(dates)==len(prices)==len(s)==len(observed)==len(counts)):
                      raise RuntimeError(f'Ticker array contract mismatch: {t}')
                  if prices and float(prices[-1])>0: price_ok+=1
                  idx=next((i for i in range(len(observed)-1,-1,-1) if observed[i]),None)
                  if idx is not None:
                      real+=1
                      if abs(float(s[idx]))>1e-12: nonzero+=1
                  for flag,n in zip(observed,counts):
                      if bool(flag)!=(int(n)>0): raise RuntimeError(f'Observed/count mismatch: {t}')
              if price_ok<100 or real<100 or nonzero<20:
                  raise RuntimeError(f'Suspicious ticker data: price_ok={price_ok}, real={real}, nonzero={nonzero}')

              displayed_news = 0
              for t in tickers:
                  p=pub/'ticker'/f'{t}.json'
                  if not p.exists():
                      continue
                  obj=load(p)
                  for item in (obj.get('news') or []):
                      displayed_news += 1
                      if not isinstance(item,dict):
                          raise RuntimeError(f'Invalid displayed news item: {t}')
                      score=item.get('s')
                      label=str(item.get('sentiment_label') or '').strip()
                      if score is None or not math.isfinite(float(score)) or not label:
                          raise RuntimeError(f'Displayed news missing article sentiment: {t} {item}')
                      probs=item.get('probs')
                      if isinstance(probs,dict):
                          vals=[float(probs.get(k,0.0)) for k in ('pos','neu','neg')]
                          if any(not math.isfinite(v) for v in vals):
                              raise RuntimeError(f'Invalid article sentiment probabilities: {t}')
                          if abs(sum(vals)-1.0)>0.02:
                              raise RuntimeError(f'Article probabilities do not sum to one: {t} {vals}')
              if displayed_news < 50:
                  raise RuntimeError(f'Too few article-scored displayed news items: {displayed_news}')
              print(f'ARTICLE SENTIMENT OK | displayed_scored_news={displayed_news}')

              port=load(pub/'portfolio_strategy.json')
              dates=port.get('dates') or []; eq=port.get('equity') or []; gross=[float(x) for x in (port.get('gross_exposure') or [])]
              if not dates or len(dates)!=len(eq): raise RuntimeError('Portfolio dates/equity invalid')
              if not gross or max(gross)>1.000001: raise RuntimeError('Portfolio gross exposure invalid')
              if any(not math.isfinite(float(x)) for x in eq): raise RuntimeError('Portfolio non-finite equity')

              research=Path('apps/web/public/research')
              idx=load(research/'index.json'); overview=load(research/'overview.json')
              if not isinstance(idx,list) or len(idx)<8: raise RuntimeError('Too few research studies')
              for item in idx:
                  slug=str(item.get('slug') or '')
                  if not slug or not (research/f'{slug}.json').is_file(): raise RuntimeError(f'Missing research payload: {slug}')

              print(f'FINAL DATA OK | SPX={close:.2f} cap_sent={sent} coverage={coverage:.3f} obs={obs} ticker_price={price_ok} ticker_sent={real} nonzero={nonzero} portfolio_days={len(dates)} research={len(idx)}')

          if __name__=='__main__': main()
          PY
          python -m py_compile /tmp/market-final/*.py

