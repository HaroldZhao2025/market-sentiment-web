          def read_spx_prices(data_root: Path, cutoff: str) -> tuple[dict[str, Any], list[dict[str, Any]]]:
              src = load_json(data_root / "SPX" / "sp500_index.json", {})
              if not isinstance(src, dict) or not isinstance(src.get("daily"), list):
                  raise RuntimeError("data/SPX/sp500_index.json is missing or invalid")
              pmap: dict[str, float] = {}
              for row in src["daily"]:
                  if not isinstance(row, dict):
                      continue
                  d = valid_day(row.get("date"))
                  close = safe_float(row.get("close"))
                  if close is None:
                      for k, v in row.items():
                          if str(k).startswith("close_"):
                              close = safe_float(v)
                              if close is not None:
                                  break
                  if d and d >= cutoff and close is not None and close > 1000:
                      pmap[d] = close
              if len(pmap) < 20:
                  raise RuntimeError(f"Too few valid SPX price rows: {len(pmap)}")
              daily = [{"date": d, "close": float(pmap[d])} for d in sorted(pmap)]
              return src, daily


          def read_current_weights(data_root: Path) -> tuple[dict[str, float], dict[str, dict[str, Any]]]:
              heat = load_json(data_root / "SPX" / "sp500_heatmap.json", {})
              tiles = heat.get("tiles") if isinstance(heat, dict) else None
              if not isinstance(tiles, list):
                  raise RuntimeError("data/SPX/sp500_heatmap.json is missing tiles")
              raw: dict[str, float] = {}
              tile_meta: dict[str, dict[str, Any]] = {}
              for tile in tiles:
                  if not isinstance(tile, dict):
                      continue
                  sym = str(tile.get("symbol") or "").strip().upper().replace(".", "-")
                  w = safe_float(tile.get("weight"))
                  if not sym:
                      continue
                  tile_meta[sym] = dict(tile)
                  if w is not None and w > 0:
                      raw[sym] = w
              total = sum(raw.values())
              if len(raw) < 100 or total <= 0:
                  raise RuntimeError(f"Too few usable current-cap weights: {len(raw)}")
              weights = {k: v / total for k, v in raw.items()}
              return weights, tile_meta


          def map_cache_to_spx_days(
              cache_records: dict[str, Any],
              spx_days: list[str],
              universe: list[str],
          ) -> dict[str, dict[str, dict[str, Any]]]:
              out: dict[str, dict[str, dict[str, Any]]] = {}
              for ticker in universe:
                  obs = records_for_ticker(cache_records, ticker)
                  if not obs:
                      continue
                  mapped = map_to_trading_days(spx_days, obs)
                  if mapped:
                      out[ticker] = mapped
              return out


          def rebuild_spx(
              data_root: Path,
              public_root: Path,
              cache_records: dict[str, Any],
              universe: list[str],
              cutoff: str,
          ) -> dict[str, Any]:
              src, daily_prices = read_spx_prices(data_root, cutoff)
              spx_days = [r["date"] for r in daily_prices]
              weights, tile_meta = read_current_weights(data_root)
              mapped = map_cache_to_spx_days(cache_records, spx_days, universe)
              weight_den_all = sum(weights.values())
              eligible_tickers = len(weights)

              daily_out = []
              for row in daily_prices:
                  d = row["date"]
                  obs = []
                  for ticker, w in weights.items():
                      rec = mapped.get(ticker, {}).get(d)
                      if rec is None:
                          continue
                      score = safe_float(rec.get("score"))
                      n = int(rec.get("n_total", 0) or 0)
                      if score is None or n <= 0:
                          continue
                      obs.append((ticker, w, score, n))
                  den = sum(w for _, w, _, _ in obs)
                  cap_sent = sum(w * s for _, w, s, _ in obs) / den if den > 0 else None
                  eq_sent = sum(s for _, _, s, _ in obs) / len(obs) if obs else None
                  n_news = sum(n for _, _, _, n in obs)
                  daily_out.append(
                      {
                          "date": d,
                          "close": float(row["close"]),
                          # Compatibility alias for the current frontend, which searches close_*.
                          "close_^GSPC": float(row["close"]),
                          "sentiment_cap_weighted": round(float(cap_sent), 8) if cap_sent is not None else None,
                          "sentiment_equal_weighted": round(float(eq_sent), 8) if eq_sent is not None else None,
                          "sentiment_coverage_market_cap": round(float(den / weight_den_all), 8) if weight_den_all else 0.0,
                          "sentiment_observed_tickers": int(len(obs)),
                          "sentiment_coverage_tickers": round(float(len(obs) / eligible_tickers), 8) if eligible_tickers else 0.0,
                          "sentiment_unique_news_count": int(n_news),
                      }
                  )

              latest = daily_out[-1]
              asof = latest["date"]
              tiles_out = []
              observed_tiles = 0
              nonzero_tiles = 0
              news_total = 0
              for ticker in sorted(tile_meta):
                  tile = dict(tile_meta[ticker])
                  rec = mapped.get(ticker, {}).get(asof)
                  if rec is not None and int(rec.get("n_total", 0) or 0) > 0:
                      score = float(rec["score"])
                      n = int(rec["n_total"])
                      tile["sentiment"] = round(score, 6)
                      tile["n_total"] = n
                      observed_tiles += 1
                      news_total += n
                      if abs(score) > 1e-12:
                          nonzero_tiles += 1
                  else:
                      tile["sentiment"] = None
                      tile["n_total"] = 0
                  tiles_out.append(tile)

              heat_src = load_json(data_root / "SPX" / "sp500_heatmap.json", {})
              stats = dict(heat_src.get("stats") or {}) if isinstance(heat_src, dict) else {}
              stats.update(
