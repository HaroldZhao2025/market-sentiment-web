          def load_json(path: Path, default: Any) -> Any:
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return default


          def load_cache(path: Path) -> dict[str, Any]:
              try:
                  with gzip.open(path, "rt", encoding="utf-8") as f:
                      obj = json.load(f)
              except Exception:
                  return {}
              return obj if isinstance(obj, dict) else {}


          def atomic_json(path: Path, obj: Any) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              fd, tmp_name = tempfile.mkstemp(prefix=f".{path.name}.", suffix=".tmp", dir=str(path.parent))
              try:
                  with os.fdopen(fd, "w", encoding="utf-8") as f:
                      json.dump(obj, f, ensure_ascii=False, indent=2, allow_nan=False)
                      f.flush()
                      os.fsync(f.fileno())
                  os.replace(tmp_name, path)
              except Exception:
                  try:
                      os.unlink(tmp_name)
                  except FileNotFoundError:
                      pass
                  raise


          def safe_float(v: Any) -> float | None:
              try:
                  x = float(v)
              except (TypeError, ValueError):
                  return None
              return x if math.isfinite(x) else None


          def valid_day(v: Any) -> str | None:
              s = str(v or "")[:10]
              try:
                  return datetime.strptime(s, "%Y-%m-%d").date().isoformat()
              except Exception:
                  return None


          def read_universe(path: Path) -> list[str]:
              with path.open(newline="", encoding="utf-8") as f:
                  rows = list(csv.DictReader(f))
              if not rows:
                  return []
              col = next((c for c in rows[0].keys() if c.lower() in {"ticker", "symbol"}), None)
              if col is None:
                  return []
              out, seen = [], set()
              for row in rows:
                  t = str(row.get(col) or "").strip().upper().replace(".", "-")
                  if t and t not in seen:
                      seen.add(t)
                      out.append(t)
              return out


          def read_prices(data_root: Path, ticker: str, cutoff: str) -> list[tuple[str, float]]:
              arr = load_json(data_root / ticker / "price" / "daily.json", [])
              if not isinstance(arr, list):
                  return []
              pmap: dict[str, float] = {}
              for row in arr:
                  if not isinstance(row, dict):
                      continue
                  d = valid_day(row.get("date"))
                  p = safe_float(row.get("close"))
                  if d and d >= cutoff and p is not None and p > 0:
                      pmap[d] = p
              return sorted(pmap.items())


          def records_for_ticker(cache_records: dict[str, Any], ticker: str) -> list[tuple[str, float, int]]:
              days = cache_records.get(ticker)
              if not isinstance(days, dict):
                  return []
              out = []
              for day, rec in days.items():
                  if not isinstance(rec, dict):
                      continue
                  d = valid_day(rec.get("date") or day)
                  x = safe_float(rec.get("score_mean"))
                  try:
                      n = int(rec.get("n_total", 0) or 0)
                  except Exception:
                      n = 0
                  if d and x is not None and n > 0:
                      out.append((d, x, n))
              return sorted(out)


          def map_to_trading_days(
              trading_days: list[str],
              observations: list[tuple[str, float, int]],
          ) -> dict[str, dict[str, Any]]:
              """Map calendar news day to same-or-next trading day; combine by unique-news count."""
              if not trading_days or not observations:
                  return {}
              num: dict[str, float] = defaultdict(float)
              den: dict[str, int] = defaultdict(int)
              source_days: dict[str, list[str]] = defaultdict(list)
              for day, score, n in observations:
                  i = bisect.bisect_left(trading_days, day)
                  if i >= len(trading_days):
                      continue
                  td = trading_days[i]
                  w = max(1, int(n))
                  num[td] += float(score) * w
                  den[td] += w
                  source_days[td].append(day)
              return {
                  d: {
                      "score": num[d] / den[d],
                      "n_total": int(den[d]),
                      "source_days": sorted(set(source_days[d])),
                  }
                  for d in num
                  if den[d] > 0
              }


          def normalize_title(value: Any) -> str:
              s = unicodedata.normalize("NFKC", str(value or "")).lower()
              s = re.sub(r"https?://\S+", " ", s)
              s = re.sub(r"[^a-z0-9]+", " ", s)
              return re.sub(r"\s+", " ", s).strip()


          def canonical_url(value: Any) -> str:
              raw = str(value or "").strip()
              if not raw:
                  return ""
              try:
                  p = urlsplit(raw)
                  host = (p.hostname or "").lower()
                  if host.startswith("www."):
                      host = host[4:]
                  return f"{host}{re.sub(r'/+', '/', p.path or '/').rstrip('/')}"
              except Exception:
                  return ""


          def recent_news(data_root: Path, ticker: str, limit: int = 10) -> list[dict[str, Any]]:
              rows = []
              seen_titles: set[str] = set()
              seen_urls: set[str] = set()
              for provider in ("finnhub", "yfinance"):
                  root = data_root / ticker / "news" / provider
                  if not root.exists():
                      continue
                  for p in sorted(root.glob("*.json"), reverse=True)[:14]:
                      arr = load_json(p, [])
                      if not isinstance(arr, list):
                          continue
                      for item in arr:
                          if not isinstance(item, dict):
                              continue
                          title = str(item.get("headline") or item.get("title") or "").strip()
                          tk = normalize_title(title)
                          if not tk:
                              continue
                          url = str(item.get("url") or item.get("link") or "").strip()
                          uk = canonical_url(url)
                          if tk in seen_titles or (uk and uk in seen_urls):
                              continue
                          seen_titles.add(tk)
                          if uk:
                              seen_urls.add(uk)
                          ts = str(item.get("ts") or "")
                          rows.append(
                              {
                                  "ts": ts,
                                  "title": title,
                                  "url": url,
                                  "source": str(item.get("source") or provider),
                                  "provider": provider,
                              }
                          )
              rows.sort(key=lambda r: (r.get("ts") or "", r.get("title") or ""), reverse=True)
              return rows[:limit]


          def build_ticker_snapshots(
              universe: list[str],
              data_root: Path,
              public_root: Path,
              portfolio_input_root: Path,
