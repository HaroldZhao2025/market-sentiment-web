          import json
          from pathlib import Path

          public_path = Path("apps/web/public/data/SPX/sp500_index.json")
          root_path = Path("data/SPX/sp500_index.json")
          public = json.loads(public_path.read_text(encoding="utf-8"))
          root = json.loads(root_path.read_text(encoding="utf-8"))

          if public != root:
              raise SystemExit("SPX synchronization failed: root data/SPX differs from public/data/SPX")

          daily = root.get("daily") or []
          if not daily:
              raise SystemExit("Homepage SPX contract invalid: no daily rows")
          latest = daily[-1]
          close = latest.get("close_^GSPC")
          sentiment = latest.get("sentiment_cap_weighted")

          if close is None or float(close) <= 1000:
              raise SystemExit(f"Homepage SPX close invalid: {latest}")
          if sentiment is None:
              raise SystemExit(f"Homepage cap-weighted sentiment missing: {latest}")

          print(
              "HOMEPAGE SPX CONTRACT OK | "
              f"date={latest.get('date')} "
              f"close={float(close):.2f} "
              f"cap_weighted={float(sentiment):.6f}"
          )
          PY

      - name: Build upgraded portfolio strategy
        shell: bash
        run: |
          set -euo pipefail
          python -m market_sentiment.cli.build_portfolio             --data-root /tmp/portfolio-input --universe data/sp500.csv             --out apps/web/public/data/portfolio_strategy.json             --rebalance weekly --signal blend --lag-days 1 --k 10 --long-short             --gross-per-side 0.5 --transaction-cost-bps 10 --risk-lookback 20             --min-coverage 0.80 --max-weight 0.10 --selection-buffer 1.50

      - name: Build all research artifacts
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/market-final/build_research_input_v2.py             --universe data/sp500.csv --data-root data             --cache data/derived/sentiment_v2.json.gz             --out-root /tmp/research-input --days 365             | tee /tmp/market-final/research-input.log
          rm -rf apps/web/public/research
          mkdir -p apps/web/public/research
          python src/market_sentiment/cli/build_research.py             --data-root /tmp/research-input --out-dir apps/web/public/research --min-obs 80             | tee /tmp/market-final/research-build.log

      - name: Apply dependency upgrade and run regression tests
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/market-final/upgrade_source.py
          python -m py_compile             src/market_sentiment/cli/build_portfolio.py             src/market_sentiment/cli/build_research.py
          if [ -f tests/test_portfolio_strategy.py ]; then
            pip install --no-cache-dir pytest
            PYTHONPATH=src pytest -q tests/test_portfolio_strategy.py
          fi

      - name: Final data-contract audit
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/market-final/validate_final_data.py | tee /tmp/market-final/final-data.log

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update lockfile and strict Next.js build
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_BASE_PATH: ${{ env.NEXT_PUBLIC_BASE_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --no-audit --no-fund
          npm ci --no-audit --no-fund
          rm -rf .next out
          npm run build
          test -s out/index.html
          test -s out/sp500/index.html
          test -s out/portfolio/index.html
          test -s out/research/index.html
          python - <<'PY'
          import json
          from pathlib import Path
          idx=json.loads(Path('public/research/index.json').read_text(encoding='utf-8'))
          missing=[]
          for item in idx:
              slug=str(item['slug']); p=Path('out/research')/slug/'index.html'
              if not p.is_file() or p.stat().st_size==0: missing.append(slug)
          if missing: raise SystemExit(f'Missing research static pages: {missing}')
          print(f'RESEARCH STATIC PAGES OK | pages={len(idx)}')
          PY
          touch out/.nojekyll
          echo "STRICT STATIC BUILD OK"

      - name: Persist validated data and regular source upgrades
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data
          git add apps/web/package.json apps/web/package-lock.json || true
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "ERROR: workflow file accidentally staged"; exit 1
          fi
          if git diff --cached --quiet; then
            echo "No validated source/data changes to persist."
          else
            git commit -m "chore: refresh validated market data and stable web dependencies [skip ci]"
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Persisted validated data/source upgrades to main."
            else
              git rebase --abort >/dev/null 2>&1 || true
              echo "::warning::Validated site will still deploy, but persistence push lost a race with main."
            fi
          fi

      - name: Publish run summary
        shell: bash
        run: |
          {
            echo "## Stable market pipeline"
            echo
            echo "- S&P price source: ^GSPC; public JSON includes canonical close and close_^GSPC compatibility alias."
            echo "- Homepage SPX: final public aggregate is synchronized to data/SPX before build, matching the homepage first-read path."
            echo "- React/TypeScript runtime rewriting: disabled."
            echo "- Sentiment: Finnhub + Yahoo cross-provider dedup; FinBERT P(positive)-P(negative); no-news is missing, not neutral zero."
            echo "- S&P aggregate: current market-cap weights renormalized only across tickers with real sentiment observations."
            echo "- Diagnostics: market-cap coverage, observed tickers, ticker coverage, unique-news count."
            echo "- Portfolio: weekly, next-day execution, blend signal, inverse-volatility sizing, 10 bp cost, 10% position cap, gross <= 1.0."
            echo "- Research rebuilt before static export; every research slug is checked."
            echo "- Next.js build is strict; deployment stops on any build/data-contract failure."
            echo
            cat /tmp/market-final/final-data.log
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload validated Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated site
        id: deployment
        uses: actions/deploy-pages@v4
