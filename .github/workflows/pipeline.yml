              cutoff: str,
          ) -> tuple[dict[str, list[tuple[str, float]]], dict[str, dict[str, dict[str, Any]]], list[str]]:
              ticker_pub = public_root / "ticker"
              if ticker_pub.exists():
                  shutil.rmtree(ticker_pub)
              ticker_pub.mkdir(parents=True, exist_ok=True)
              p_ticker = portfolio_input_root / "ticker"
              if p_ticker.exists():
                  shutil.rmtree(p_ticker)
              p_ticker.mkdir(parents=True, exist_ok=True)

              prices_by_ticker: dict[str, list[tuple[str, float]]] = {}
              mapped_by_ticker: dict[str, dict[str, dict[str, Any]]] = {}
              written: list[str] = []

              for ticker in universe:
                  prices = read_prices(data_root, ticker, cutoff)
                  if len(prices) < 20:
                      continue
                  trading_days = [d for d, _ in prices]
