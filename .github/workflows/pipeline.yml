          python - <<'PY'
          import gzip
          import json
          import os
          from pathlib import Path

          cache_path = Path("data/derived/sentiment_v2.json.gz")
          expected = os.environ["SENTIMENT_ALGORITHM_VERSION"]
          with gzip.open(cache_path, "rt", encoding="utf-8") as f:
              cache = json.load(f)
          actual = str(cache.get("algorithm_version") or "")
          if actual != expected:
              raise SystemExit(
                  f"SENTIMENT CONTRACT FAIL | cache={actual!r} expected={expected!r}"
              )
          records = cache.get("records")
          if not isinstance(records, dict) or not records:
              raise SystemExit("SENTIMENT CONTRACT FAIL | cache records missing")
          article_rows = 0
          scored_article_rows = 0
          for days in records.values():
              if not isinstance(days, dict):
                  continue
              for rec in days.values():
                  if not isinstance(rec, dict):
                      continue
                  articles = rec.get("articles")
                  if not isinstance(articles, list):
                      continue
                  article_rows += len(articles)
                  scored_article_rows += sum(
                      1 for a in articles
                      if isinstance(a, dict)
                      and a.get("s") is not None
                      and str(a.get("sentiment_label") or "").strip()
                  )
          if scored_article_rows < 50:
              raise SystemExit(
                  f"SENTIMENT CONTRACT FAIL | only {scored_article_rows} scored article rows"
              )
          print(
              "SENTIMENT CONTRACT OK | "
              f"version={actual} records_tickers={len(records)} "
              f"article_rows={article_rows} scored_article_rows={scored_article_rows}"
          )
