              if close <= 1000:
                  raise RuntimeError(f"SPX price scale invalid: {close}")
              observed = int(spx_summary["latest_observed_tickers"])
              if observed < 5:
                  raise RuntimeError(f"Too few SPX tickers with real sentiment on latest SPX date: {observed}")
              if latest_real < 100 or latest_nonzero < 20:
                  raise RuntimeError(
                      f"Suspicious ticker sentiment coverage: latest_real={latest_real}, latest_nonzero={latest_nonzero}"
                  )

              print(
                  "SITE DATA OK | "
                  f"ticker_files={len(written)} latest_real_ticker_sentiment={latest_real} "
                  f"latest_nonzero_real_sentiment={latest_nonzero} "
                  f"SPX_date={spx_summary['latest_date']} SPX={close:.2f} "
                  f"SPX_sentiment={spx_summary['latest_sentiment']} "
                  f"SPX_mcap_coverage={spx_summary['latest_coverage_market_cap']:.4f} "
                  f"SPX_observed_tickers={observed} SPX_unique_news={spx_summary['latest_unique_news']}"
              )


          def main() -> None:
