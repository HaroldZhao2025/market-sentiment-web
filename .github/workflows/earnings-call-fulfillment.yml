name: Fulfill Earnings Calls

on:
  push:
    paths:
      - ".github/workflows/earnings-call-fulfillment.yml"
      - ".github/earnings-fulfillment-trigger"
  workflow_dispatch:
    inputs:
      batch_index:
        description: "Fulfillment sweep label"
        required: false
        default: "0"
      batch_size:
        description: "Companies per sweep"
        required: false
        default: "100"
  schedule:
    - cron: "20 * * * *"

permissions:
  contents: write

concurrency:
  group: earnings-call-fulfillment
  cancel-in-progress: true

env:
  PYTHONPATH: src
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  fulfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout: |
            src/market_sentiment
            apps/web/public/data/v5
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hf-home
          key: phase9-finbert-${{ runner.os }}-py311

      - name: Install free-source fulfillment dependencies
        run: |
          set -euo pipefail
          echo "HF_HOME=${RUNNER_TEMP}/hf-home" >> "$GITHUB_ENV"
          pip install --disable-pip-version-check --no-cache-dir \
            "numpy>=1.26,<3" "pandas>=2.1,<3" "requests>=2.31" "yfinance>=0.2.50" \
            "beautifulsoup4>=4.12" "lxml>=5.2"
          pip install --disable-pip-version-check --no-cache-dir "torch==2.3.1+cpu" --index-url https://download.pytorch.org/whl/cpu
          pip install --disable-pip-version-check --no-cache-dir "transformers==4.45.2" "tokenizers==0.20.3"

      - name: Resolve sweep
        id: batch
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BATCH_INDEX: ${{ github.event.inputs.batch_index }}
          INPUT_BATCH_SIZE: ${{ github.event.inputs.batch_size }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime, os
          now = datetime.datetime.now(datetime.timezone.utc)
          if os.getenv("EVENT_NAME") == "workflow_dispatch":
              index = int(os.getenv("INPUT_BATCH_INDEX") or 0)
              size = int(os.getenv("INPUT_BATCH_SIZE") or 100)
          else:
              index = (now.timetuple().tm_yday - 1) * 24 + now.hour
              size = 100
          print(f"index={index}")
          print(f"size={size}")
          PY

      - name: Fulfill free public earnings calls
        run: |
          set -euo pipefail
          python -m market_sentiment.cli.fulfill_earnings_calls_fast \
            --public-root apps/web/public \
            --batch-index "${{ steps.batch.outputs.index }}" \
            --batch-size "${{ steps.batch.outputs.size }}" \
            --priority-symbols "AAPL,MSFT,NVDA,AMZN,GOOGL,META,TSLA" \
            --sec-days 550 \
            --retry-cooldown-hours 24

      - name: Validate fulfillment policy
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("apps/web/public/data/v5")
          status = json.loads((root / "earnings_fulfillment_status.json").read_text())
          coverage = json.loads((root / "earnings_coverage.json").read_text())
          if status.get("source_policy") != "free_public_only" or coverage.get("source_policy") != "free_public_only":
              raise SystemExit("Fulfillment source policy is not free_public_only")
          if int(coverage.get("company_count") or 0) < 1300:
              raise SystemExit("Earnings coverage universe is unexpectedly small")
          aapl_path = root / "earnings" / "AAPL.json"
          if not aapl_path.exists():
              raise SystemExit("AAPL earnings artifact missing")
          aapl = json.loads(aapl_path.read_text())
          complete = []
          for call in aapl.get("calls") or []:
              summary = call.get("summary") or {}
              if all(summary.get(k) is not None for k in ("overall_sentiment", "prepared_sentiment", "qa_sentiment", "qa_tone_shift")):
                  complete.append(call)
              for turn in call.get("turns") or []:
                  if turn.get("text"):
                      raise SystemExit("Transcript text must not be redistributed in public artifacts")
          if not complete:
              raise SystemExit("AAPL complete structured-call gate failed")
          print(
              f"FULFILLMENT DATA OK | sweep_results={len(status.get('results') or [])} "
              f"market_complete={coverage.get('complete_company_count')}/{coverage.get('company_count')} "
              f"coverage={float(coverage.get('complete_coverage_rate') or 0):.1%}"
          )
          PY

      - name: Persist fulfillment artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            apps/web/public/data/v5/earnings \
            apps/web/public/data/v5/earnings_fulfillment_status.json \
            apps/web/public/data/v5/earnings_fulfillment_attempts.json \
            apps/web/public/data/v5/earnings_coverage.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sweep free earnings calls ${{ steps.batch.outputs.index }} [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
