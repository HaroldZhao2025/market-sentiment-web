name: Repair Diagnostics

on:
  push:
    branches: ["fix/production-hardening-20261001"]
    paths: [".github/workflows/repair-diagnostics.yml"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            src
            scripts
            tests
            apps/web
            data/derived
            data/SPX
      - name: Package source and real cache diagnostics
        run: |
          python - <<'PY'
          import gzip, json, zipfile
          from pathlib import Path
          from collections import Counter
          root = Path('/tmp/repair-diagnostics')
          root.mkdir()
          cache_path = Path('data/derived/sentiment_v2.json.gz')
          with gzip.open(cache_path, 'rt', encoding='utf-8') as f:
              cache = json.load(f)
          rows = [r for days in cache['records'].values() for r in days.values()]
          dates = [r.get('date') for r in rows if r.get('date')]
          summary = {'algorithm_version': cache.get('algorithm_version'), 'records': len(rows),
              'observed': sum((r.get('n_total') or 0)>0 for r in rows),
              'min_date': min(dates), 'max_date': max(dates),
              'versions': dict(Counter(r.get('algorithm_version') for r in rows)),
              'sample': rows[:3]}
          (root/'cache-summary.json').write_text(json.dumps(summary, indent=2))
          print(json.dumps({k:v for k,v in summary.items() if k != 'sample'}, indent=2))
          with zipfile.ZipFile(root/'repository-source.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for directory in ['.github', 'src', 'scripts', 'tests', 'apps/web']:
                  for p in Path(directory).rglob('*'):
                      if p.is_file() and not any(x in p.parts for x in ['node_modules', '.next', 'out', '__pycache__']):
                          z.write(p, str(p))
              for p in Path('.').iterdir():
                  if p.is_file() and p.stat().st_size < 2000000:
                      z.write(p, str(p))
              for p in Path('data/SPX').glob('*.json'):
                  z.write(p, str(p))
              for p in Path('data').glob('*.csv'):
                  z.write(p, str(p))
              z.write(cache_path, str(cache_path))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: repair-diagnostics
          path: /tmp/repair-diagnostics
          retention-days: 3
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Strict TypeScript check
        working-directory: apps/web
        run: npx tsc --noEmit
      - name: Independent Next.js production build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_BASE_PATH: /market-sentiment-web
        run: npm run build
