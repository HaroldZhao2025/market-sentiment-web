          #!/usr/bin/env python3
          from __future__ import annotations

          import argparse
          import bisect
          import csv
          import gzip
          import json
          import math
          import shutil
          from collections import defaultdict
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from typing import Any


          def load_json(path: Path, default: Any) -> Any:
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return default


          def load_cache(path: Path) -> dict[str, Any]:
              try:
                  with gzip.open(path, "rt", encoding="utf-8") as f:
                      x = json.load(f)
                  return x if isinstance(x, dict) else {}
              except Exception:
                  return {}


          def finite(v: Any) -> float | None:
              try:
                  x = float(v)
              except (TypeError, ValueError):
                  return None
              return x if math.isfinite(x) else None


          def valid_day(v: Any) -> str | None:
              s = str(v or "")[:10]
              try:
                  return datetime.strptime(s, "%Y-%m-%d").date().isoformat()
              except Exception:
                  return None


          def read_universe(path: Path) -> list[str]:
              with path.open(newline="", encoding="utf-8") as f:
                  rows = list(csv.DictReader(f))
              if not rows:
                  return []
              col = next((c for c in rows[0].keys() if c.lower() in {"ticker", "symbol"}), None)
              if col is None:
                  return []
              out, seen = [], set()
              for row in rows:
                  t = str(row.get(col) or "").strip().upper().replace(".", "-")
                  if t and t not in seen:
                      seen.add(t)
                      out.append(t)
              return out


          def read_prices(data_root: Path, ticker: str, cutoff: str) -> list[tuple[str, float]]:
              arr = load_json(data_root / ticker / "price" / "daily.json", [])
              pmap = {}
              if isinstance(arr, list):
                  for row in arr:
                      if not isinstance(row, dict):
                          continue
                      d = valid_day(row.get("date"))
                      p = finite(row.get("close"))
                      if d and d >= cutoff and p is not None and p > 0:
                          pmap[d] = p
              return sorted(pmap.items())


          def observations(cache_records: dict[str, Any], ticker: str) -> list[tuple[str, float, int]]:
              days = cache_records.get(ticker)
              if not isinstance(days, dict):
                  return []
              out = []
              for day, rec in days.items():
                  if not isinstance(rec, dict):
                      continue
                  d = valid_day(rec.get("date") or day)
                  s = finite(rec.get("score_mean"))
                  n = int(rec.get("n_total", 0) or 0)
                  if d and s is not None and n > 0:
                      out.append((d, s, n))
              return sorted(out)


          def map_obs(trading_days: list[str], obs: list[tuple[str, float, int]]) -> dict[str, tuple[float, int]]:
              num: dict[str, float] = defaultdict(float)
              den: dict[str, int] = defaultdict(int)
              for d, s, n in obs:
                  i = bisect.bisect_left(trading_days, d)
                  if i >= len(trading_days):
                      continue
                  td = trading_days[i]
                  w = max(1, int(n))
                  num[td] += s * w
                  den[td] += w
              return {d: (num[d] / den[d], den[d]) for d in num if den[d] > 0}


          def main() -> None:
              ap = argparse.ArgumentParser()
              ap.add_argument("--universe", default="data/sp500.csv")
              ap.add_argument("--data-root", default="data")
              ap.add_argument("--cache", default="data/derived/sentiment_v2.json.gz")
              ap.add_argument("--out-root", default="/tmp/research-input")
              ap.add_argument("--days", type=int, default=365)
              args = ap.parse_args()

              cache = load_cache(Path(args.cache))
              records = cache.get("records")
              if not isinstance(records, dict):
                  raise RuntimeError("No sentiment_v2 records available for research")
              universe = read_universe(Path(args.universe))
              cutoff = (datetime.now(timezone.utc).date() - timedelta(days=max(180, int(args.days)))).isoformat()

              root = Path(args.out_root)
              if root.exists():
                  shutil.rmtree(root)
              ticker_dir = root / "ticker"
              ticker_dir.mkdir(parents=True, exist_ok=True)

              written = 0
              rows_total = 0
              observed_total = 0
              for ticker in universe:
                  prices = read_prices(Path(args.data_root), ticker, cutoff)
                  if len(prices) < 80:
                      continue
                  tdays = [d for d, _ in prices]
                  mapped = map_obs(tdays, observations(records, ticker))
                  if not mapped:
                      continue
                  first_obs = min(mapped)
                  active = [(d, p) for d, p in prices if d >= first_obs]
                  if len(active) < 80:
                      continue

                  dates = []
                  price_arr = []
                  s_arr = []
                  n_arr = []
                  observed_arr = []
                  for d, p in active:
                      rec = mapped.get(d)
                      # Research-only convention:
                      # a no-news trading day has zero *sentiment shock / activity*, not a measured neutral article.
                      # n_total and sentiment_observed preserve that distinction.
                      score = float(rec[0]) if rec is not None else 0.0
                      n = int(rec[1]) if rec is not None else 0
                      dates.append(d)
                      price_arr.append(round(float(p), 6))
                      s_arr.append(round(score, 6))
                      n_arr.append(n)
                      observed_arr.append(rec is not None)

                  obj = {
                      "ticker": ticker,
                      "dates": dates,
                      "price": price_arr,
                      "S": s_arr,
                      "sentiment": s_arr,
                      "n_total": n_arr,
                      "sentiment_observed": observed_arr,
                      "research_input_semantics": (
                          "Dense trading-day panel. On news-observation dates S is the deduplicated FinBERT ticker score; "
                          "on no-news trading dates S=0 denotes no sentiment shock/activity, while n_total=0 and "
                          "sentiment_observed=false explicitly distinguish this from a measured neutral-news score."
                      ),
                  }
                  (ticker_dir / f"{ticker}.json").write_text(
                      json.dumps(obj, ensure_ascii=False, separators=(",", ":"), allow_nan=False),
                      encoding="utf-8",
                  )
                  written += 1
                  rows_total += len(dates)
                  observed_total += sum(observed_arr)

              if written < 100:
                  raise RuntimeError(f"Too few research ticker panels: {written}")
              print(
                  f"RESEARCH INPUT OK | tickers={written} rows={rows_total} "
                  f"observed_sentiment_days={observed_total} avg_rows={rows_total/written:.1f}"
              )


          if __name__ == "__main__":
              main()

          PY

          python -m py_compile \
            /tmp/market-complete/build_sentiment_v2.py \
            /tmp/market-complete/build_complete_site.py \
            /tmp/market-complete/build_research_input_v2.py

      - name: Scan raw news and deduplicate sentiment inputs
        id: sentiment_scan
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DAYS=365
          else
            DAYS=14
          fi

          python /tmp/market-complete/build_sentiment_v2.py scan \
            --universe data/sp500.csv \
            --data-root data \
            --cache data/derived/sentiment_v2.json.gz \
            --manifest /tmp/market-complete/sentiment_manifest.json \
            --days "$DAYS" \
            --initial-days 365 \
            | tee /tmp/market-complete/sentiment-scan.log

          PENDING="$(python - <<'PY'
          import json
          from pathlib import Path
          p = Path("/tmp/market-complete/sentiment_manifest.json")
          arr = json.loads(p.read_text(encoding="utf-8")) if p.exists() else []
          print(len(arr) if isinstance(arr, list) else 0)
          PY
          )"
          echo "pending=$PENDING" >> "$GITHUB_OUTPUT"
          if [ "$PENDING" -gt 0 ]; then
            echo "need_model=true" >> "$GITHUB_OUTPUT"
          else
            echo "need_model=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Changed ticker/day sentiment records requiring FinBERT: $PENDING"

      - name: Cache FinBERT model
        if: steps.sentiment_scan.outputs.need_model == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hf-home
          key: finbert-prosus-v2-${{ runner.os }}-py311

      - name: Install FinBERT only when scoring is needed
        if: steps.sentiment_scan.outputs.need_model == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "HF_HOME=${RUNNER_TEMP}/hf-home" >> "$GITHUB_ENV"
          pip install --no-cache-dir "torch==2.3.1+cpu" --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir "transformers==4.45.2" "tokenizers==0.20.3"

      - name: Score unique headlines with FinBERT
        if: steps.sentiment_scan.outputs.need_model == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/market-complete/build_sentiment_v2.py score \
            --cache data/derived/sentiment_v2.json.gz \
            --manifest /tmp/market-complete/sentiment_manifest.json \
            --batch-size 64 \
            | tee /tmp/market-complete/sentiment-score.log

      - name: Validate sentiment v2 cache
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/market-complete/build_sentiment_v2.py validate \
            --cache data/derived/sentiment_v2.json.gz \
            | tee /tmp/market-complete/sentiment-validate.log

      - name: Build corrected ticker and S&P 500 site data
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apps/web/public/data/ticker apps/web/public/data/SPX /tmp/portfolio-input
          mkdir -p apps/web/public/data

          python /tmp/market-complete/build_complete_site.py \
            --universe data/sp500.csv \
            --data-root data \
            --public-root apps/web/public/data \
            --cache data/derived/sentiment_v2.json.gz \
            --portfolio-input /tmp/portfolio-input \
            --days 365 \
            | tee /tmp/market-complete/site-data.log

      - name: Build upgraded portfolio strategy
        shell: bash
        run: |
          set -euo pipefail
          python -m market_sentiment.cli.build_portfolio \
            --data-root /tmp/portfolio-input \
            --universe data/sp500.csv \
            --out apps/web/public/data/portfolio_strategy.json \
            --rebalance weekly \
            --signal blend \
            --lag-days 1 \
            --k 10 \
            --long-short \
            --gross-per-side 0.5 \
            --transaction-cost-bps 10 \
            --risk-lookback 20 \
            --min-coverage 0.80 \
            --max-weight 0.10 \
            --selection-buffer 1.50

          python - <<'PY'
          import json
          import math
          from pathlib import Path
          p = Path("apps/web/public/data/portfolio_strategy.json")
          obj = json.loads(p.read_text(encoding="utf-8"))
          dates = obj.get("dates") or []
          eq = obj.get("equity") or []
          gross = [float(x) for x in (obj.get("gross_exposure") or [])]
          if not dates or len(dates) != len(eq):
              raise SystemExit("Portfolio dates/equity contract invalid")
          if not gross or max(gross) > 1.000001:
              raise SystemExit(f"Portfolio gross exposure invalid: {max(gross) if gross else None}")
          if any(not math.isfinite(float(x)) for x in eq):
              raise SystemExit("Portfolio equity contains non-finite values")
          print(
              f"PORTFOLIO OK | days={len(dates)} max_gross={max(gross):.4f} "
              f"latest_equity={float(eq[-1]):.4f}"
          )
          PY

      - name: Build corrected research panel and all research artifacts
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/market-complete/build_research_input_v2.py \
            --universe data/sp500.csv \
            --data-root data \
            --cache data/derived/sentiment_v2.json.gz \
            --out-root /tmp/research-input \
            --days 365 \
            | tee /tmp/market-complete/research-input.log

          rm -rf apps/web/public/research
          mkdir -p apps/web/public/research

          python src/market_sentiment/cli/build_research.py \
            --data-root /tmp/research-input \
            --out-dir apps/web/public/research \
            --min-obs 80 \
            | tee /tmp/market-complete/research-build.log

          python - <<'PY'
          import json
          import re
          from pathlib import Path
          root = Path("apps/web/public/research")
          index_path = root / "index.json"
          overview_path = root / "overview.json"
          if not index_path.is_file() or index_path.stat().st_size == 0:
              raise SystemExit("Research index.json missing")
          if not overview_path.is_file() or overview_path.stat().st_size == 0:
              raise SystemExit("Research overview.json missing")
          index = json.loads(index_path.read_text(encoding="utf-8"))
          overview = json.loads(overview_path.read_text(encoding="utf-8"))
          if not isinstance(index, list) or len(index) < 8:
              raise SystemExit(f"Too few research studies: {len(index) if isinstance(index, list) else 'invalid'}")
          seen = set()
          for item in index:
              slug = str(item.get("slug") or "")
              if not re.fullmatch(r"[A-Za-z0-9_-]+", slug):
                  raise SystemExit(f"Invalid research slug: {slug!r}")
              if slug in seen:
                  raise SystemExit(f"Duplicate research slug: {slug}")
              seen.add(slug)
              payload = root / f"{slug}.json"
              if not payload.is_file() or payload.stat().st_size == 0:
                  raise SystemExit(f"Missing research payload: {slug}")
          meta = overview.get("meta") if isinstance(overview, dict) else None
          if not isinstance(meta, dict):
              raise SystemExit("Research overview meta invalid")
          print(
              f"RESEARCH ARTIFACTS OK | studies={len(index)} "
              f"tickers={meta.get('n_tickers')} panel_obs={meta.get('n_obs_panel')} "
              f"date_range={meta.get('date_range')}"
          )
          PY

      - name: Final data-contract audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          pub = Path("apps/web/public/data")
          spx = json.loads((pub / "SPX" / "sp500_index.json").read_text(encoding="utf-8"))
          daily = spx.get("daily") or []
          if not daily:
              raise SystemExit("SPX daily is empty")
          latest = daily[-1]
          close = float(latest["close"])
          alias = float(latest["close_^GSPC"])
          if close <= 1000 or abs(close - alias) > 1e-8:
              raise SystemExit(f"SPX price contract invalid: close={close}, alias={alias}")
          obs = int(latest.get("sentiment_observed_tickers", 0) or 0)
          coverage = float(latest.get("sentiment_coverage_market_cap", 0) or 0)
          sent = latest.get("sentiment_cap_weighted")
          if obs < 5 or coverage <= 0:
              raise SystemExit(f"SPX sentiment coverage too low: observed={obs}, coverage={coverage}")
          if sent is None or not math.isfinite(float(sent)):
              raise SystemExit("Latest SPX sentiment is missing despite positive coverage")

          heat = json.loads((pub / "SPX" / "sp500_heatmap.json").read_text(encoding="utf-8"))
          tiles = heat.get("tiles") or []
          fake_zero = [
              t for t in tiles
              if int(t.get("n_total", 0) or 0) == 0 and t.get("sentiment") == 0
          ]
          if fake_zero:
              raise SystemExit(f"Found {len(fake_zero)} no-news tiles encoded as neutral zero")
          observed_tiles = sum(
              1 for t in tiles
              if int(t.get("n_total", 0) or 0) > 0 and t.get("sentiment") is not None
          )
          if observed_tiles < 5:
              raise SystemExit(f"Too few observed heatmap sentiments: {observed_tiles}")

          print(
              f"FINAL DATA CONTRACTS OK | SPX={close:.2f} sentiment={float(sent):.6f} "
              f"mcap_coverage={coverage:.4f} observed_tickers={obs} heatmap_observed={observed_tiles}"
          )
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Strict Next.js production build
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_BASE_PATH: ${{ env.NEXT_PUBLIC_BASE_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

          rm -rf .next out
          npm run build

          test -s out/index.html
          test -s out/sp500/index.html
          test -s out/portfolio/index.html
          test -s out/research/index.html

          python - <<'PY'
          import json
          from pathlib import Path
          index = json.loads(Path("public/research/index.json").read_text(encoding="utf-8"))
          missing = []
          for item in index:
              slug = str(item["slug"])
              p = Path("out/research") / slug / "index.html"
              if not p.is_file() or p.stat().st_size == 0:
                  missing.append(slug)
          if missing:
              raise SystemExit(f"Missing research static HTML pages: {missing}")
          print(f"RESEARCH STATIC PAGES OK | pages={len(index)}")
          PY

          touch out/.nojekyll
          echo "STRICT STATIC BUILD OK"

      - name: Persist sentiment v2 cache
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f data/derived/sentiment_v2.json.gz

          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "ERROR: workflow file accidentally staged."
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "sentiment_v2 cache unchanged; no commit needed."
          else
            git commit -m "chore(data): update deduplicated sentiment v2 [skip ci]"
            if git push origin HEAD:main; then
              echo "Persisted sentiment_v2 cache to main."
            else
              echo "::warning::Could not persist sentiment_v2 cache because main changed during this run. The validated site will still deploy; a later run can rebuild the cache."
            fi
          fi

      - name: Publish methodology summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Complete market pipeline"
            echo
            echo "- Article duplicates: removed within ticker/day across Finnhub + Yahoo by normalized headline or canonical URL."
            echo "- FinBERT article score: P(positive) - P(negative)."
            echo "- Ticker daily sentiment: equal-weight mean of unique headlines."
            echo "- No-news: missing observation, never a real neutral zero."
            echo "- S&P sentiment: current market-cap snapshot weights, renormalized across tickers with real observations."
            echo "- S&P diagnostics: market-cap coverage, ticker coverage, observed ticker count, unique-news count."
            echo "- Portfolio: sparse observed sentiment input with max 5-trading-day staleness handled by the upgraded strategy builder."
            echo "- Research: dense trading-day panel; no-news day is explicitly an inactive sentiment shock (S=0, n_total=0), not a measured neutral-news article."
            echo
            cat /tmp/market-complete/sentiment-validate.log
            cat /tmp/market-complete/site-data.log
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload final site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy final validated site
        id: deployment
        uses: actions/deploy-pages@v4
