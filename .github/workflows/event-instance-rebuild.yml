name: Rebuild Event Instances

on:
  push:
    paths:
      - ".github/workflows/event-instance-rebuild.yml"
      - ".github/event-instance-rebuild-trigger"
  workflow_dispatch:
  schedule:
    - cron: "52 */4 * * *"

permissions:
  contents: write

concurrency:
  group: event-instance-rebuild
  cancel-in-progress: true

env:
  PYTHONPATH: src

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout: |
            src/market_sentiment
            apps/web/public/data/v5
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild persistent event instances
        run: |
          set -euo pipefail
          python -m market_sentiment.cli.rebuild_event_instances \
            --public-root apps/web/public \
            --window-days 2

      - name: Validate event artifact
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("apps/web/public/data/v5/event_instances.json")
          payload = json.loads(path.read_text())
          inputs = payload.get("input") or {}
          if payload.get("source_policy") != "free_public_only":
              raise SystemExit("Event source policy changed")
          if int(inputs.get("company_count") or 0) < 1300:
              raise SystemExit("Unexpected company universe size")
          if int(inputs.get("companies_with_retained_news") or 0) < 1300:
              raise SystemExit("Retained-news company coverage unexpectedly low")
          if int(payload.get("event_instance_count") or 0) <= 0:
              raise SystemExit("No event instances generated")
          if not isinstance(payload.get("event_instances"), list):
              raise SystemExit("event_instances missing")
          print(
              f"EVENT DATA OK | companies={inputs.get('companies_with_retained_news')}/{inputs.get('company_count')} "
              f"events={payload.get('event_instance_count')}"
          )
          PY

      - name: Persist event artifact
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apps/web/public/data/v5/event_instances.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: rebuild persistent event instances [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
