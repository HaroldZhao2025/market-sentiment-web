name: Repair News Probe
on:
  push:
    branches: ["fix/production-hardening-20261001"]
    paths: [".github/workflows/repair-news-probe.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: src/market_sentiment
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --disable-pip-version-check yfinance requests beautifulsoup4 lxml
      - name: Inspect bounded public news responses
        env:
          PYTHONPATH: src
        run: |
          python -u - <<'PY'
          import json
          from pathlib import Path
          import yfinance as yf
          from market_sentiment.v5_news import _timestamp, google_news_rss
          result={'yfinance_version':yf.__version__,'tickers':{}}
          for ticker in ['AAPL','MSFT']:
              row={}
              try:
                  items=yf.Ticker(ticker).get_news(count=10,tab='all') or []
                  row['count']=len(items)
                  if items:
                      row['sample']=items[0]
                      item=items[0]
                      content=item.get('content') or {}
                      candidates={name:content.get(name) for name in ['pubDate','displayTime','published']}
                      candidates['providerPublishTime']=item.get('providerPublishTime')
                      row['legacy_timestamp_fields']={k:str(_timestamp(v)) for k,v in candidates.items()}
              except Exception as e:
                  row['error']=str(e)
              rss=google_news_rss(ticker,days=5,count=3)
              row['rss_count']=len(rss)
              row['rss_dates']=[r['ts'] for r in rss]
              result['tickers'][ticker]=row
          Path('/tmp/news-probe.json').write_text(json.dumps(result,indent=2,default=str))
          print(json.dumps(result,indent=2,default=str))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: repair-news-probe
          path: /tmp/news-probe.json
          retention-days: 3
