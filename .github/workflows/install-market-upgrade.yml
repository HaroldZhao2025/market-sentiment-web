      - name: Verify the installed code
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            src/market_sentiment/cli/build_sp500_index.py \
            src/market_sentiment/cli/build_portfolio.py \
            scripts/validate_artifacts.py \
            tests/test_portfolio_strategy.py

          grep -Fq "INDEX_PRICE_SYMBOL_CANDIDATES = [\"^GSPC\", \"^SPX\"]" src/market_sentiment/cli/build_sp500_index.py
          grep -Fq -- "--signal blend" .github/workflows/pipeline.yml
          grep -Fq "npm run build" .github/workflows/pipeline.yml
          if grep -Fq "npm run build || true" .github/workflows/pipeline.yml; then
            echo "Unsafe frontend build suppression is still present."
            exit 1
          fi
          grep -Fq "signal?: \"day\" | \"ma7\" | \"blend\";" apps/web/app/portfolio/PortfolioClient.tsx
          test -s .github/workflows/ci.yml
          test -s scripts/validate_artifacts.py
          test -s tests/test_portfolio_strategy.py
          echo "Static verification passed."

      - name: Commit and upload the upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The repository already contains this upgrade."
            exit 0
          fi
          git commit -m "fix: stabilize S&P 500 data, portfolio strategy, and deployment"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Finish
        run: |
          echo "Upgrade successfully committed to main."
          echo "The normal Build Data & Deploy Site workflow will start from the new commit."
