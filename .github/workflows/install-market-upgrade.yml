name: Install Market Sentiment Upgrade

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-market-sentiment-upgrade
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Create automatic backup branch
        shell: bash
        run: |
          set -euo pipefail
          BACKUP_BRANCH="backup-before-market-upgrade-${GITHUB_RUN_ID}"
          git branch "$BACKUP_BRANCH"
          git push origin "$BACKUP_BRANCH"
          echo "Backup created: $BACKUP_BRANCH"

      - name: Apply verified upgrade
