      - name: Apply V2 upgrade
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/market-upgrade-v2/apply_upgrade_v2.py
          git diff --check
          python -m py_compile             src/market_sentiment/cli/build_sp500_index.py             src/market_sentiment/cli/build_portfolio.py             scripts/validate_artifacts.py

      - name: Run portfolio regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pandas numpy pytest
          PYTHONPATH=src pytest -q tests/test_portfolio_strategy.py

      - name: Verify frontend build
        working-directory: apps/web
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_BASE_PATH: "/market-sentiment-web"
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          test -s out/index.html

      - name: Commit and upload upgraded project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             src/market_sentiment/cli/build_sp500_index.py             src/market_sentiment/cli/build_portfolio.py             apps/web/app/sp500/page.tsx             apps/web/app/portfolio/page.tsx             apps/web/app/portfolio/PortfolioClient.tsx             .github/workflows/pipeline.yml             .github/workflows/ci.yml             scripts/validate_artifacts.py             tests/test_portfolio_strategy.py
          if git diff --cached --quiet; then
            echo "Upgrade is already installed; nothing to commit."
          else
            git commit -m "fix: stabilize SP500 data and upgrade portfolio strategy"
            git push origin HEAD:main
          fi

      - name: Start fresh data build and deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run pipeline.yml --ref main
          echo "SUCCESS: upgrade is on main and a fresh Build Data & Deploy Site run was started."
